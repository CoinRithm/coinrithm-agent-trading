name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: packages/mcp-trading/package-lock.json

      - name: Build MCP server
        working-directory: packages/mcp-trading
        run: |
          npm ci
          npm run build

      - name: Syntax-check examples (.mjs)
        run: |
          for f in examples/*.mjs examples/bots/*.mjs; do
            echo "node --check $f"
            node --check "$f"
          done

      - name: Syntax-check examples (.py)
        run: python3 -m py_compile examples/python/*.py

      - name: OpenAPI lint (baseline-tolerant)
        run: |
          # The spec carries a known baseline of pre-existing structural lint
          # errors (mostly OpenAPI 3.1 strictness on long-stable schema blocks).
          # This gate fails ONLY if the error count GROWS beyond the baseline,
          # so new endpoints/schemas must not add new lint errors.
          BASELINE=81
          out=$(NO_COLOR=1 npx -y @redocly/cli@2.32.0 lint openapi.yaml 2>&1) || true
          echo "$out"
          errors=$(echo "$out" | grep -oE 'failed with [0-9]+ error' | grep -oE '[0-9]+' || true)
          errors=${errors:-0}
          echo "redocly errors: $errors (baseline: $BASELINE)"
          if [ "$errors" -gt "$BASELINE" ]; then
            echo "::error::openapi.yaml lint errors increased: $errors > baseline $BASELINE"
            exit 1
          fi

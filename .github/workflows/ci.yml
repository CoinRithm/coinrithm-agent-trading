name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # The published npm SDK must be reproducible from the canonical contract.
  # Regeneration drift means consumers are missing declared fields even when
  # the OpenAPI document itself is correct.
  typescript-sdk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/sdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: packages/sdk/package-lock.json

      - name: TypeScript SDK — audit, regenerate, verify, package
        run: |
          npm ci
          npm audit --audit-level=high
          npm run generate
          git diff --exit-code -- src/schema.ts
          npm run typecheck
          npm run build
          npm pack --dry-run

  # The published PyPI SDK: deterministic Python 3.12 environment, generated
  # client behavior, and installable artifacts. uv.lock is committed.
  python-sdk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/sdk-python
    steps:
      - uses: actions/checkout@v4
      - name: Install uv and Python 3.12
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.0"
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: packages/sdk-python/uv.lock

      - name: Python SDK — regenerate, test, compile, build
        run: |
          uv sync --locked
          uv run openapi-python-client generate \
            --path ../../openapi.yaml \
            --config openapi-python-client.yaml \
            --meta none \
            --output-path coinrithm_sdk \
            --overwrite \
            --fail-on-warning
          touch coinrithm_sdk/py.typed
          git diff --exit-code -- coinrithm_sdk
          uv run pytest -q
          uv run python -m compileall -q coinrithm_sdk
          uv build
          uv run --isolated --no-project --with ./dist/coinrithm_sdk-*.whl \
            python -c "from coinrithm_sdk import Client; assert Client(base_url='https://api.coinrithm.com')"

  # The published npm package: MCP server + agent runner (both live here).
  mcp-trading:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Secret scan (audit reliability lane, 2026-08-11). A STEP inside the
      # main job, not a parallel job, and the plain binary rather than the
      # gitleaks-action - both lessons from the coinrithm frontend rollout
      # (2026-08-06): a separate job needed its own runner + checkout and was
      # routinely cancelled by follow-up pushes, making CI a false red; the
      # Docker-image action was too slow for the same reason. Config:
      # .gitleaks.toml (default ruleset in full + line-anchored allowlists for
      # verified false positives). Proven before landing: clean `git archive`
      # checkout scans exit 0, and a planted correctly-shaped canary PAT next
      # to an allowlisted line still fails the scan.
      - name: Secret scan
        run: |
          set -euo pipefail
          VERSION=8.28.0
          URL="https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz"
          curl -sSfL "$URL" | tar -xz gitleaks
          ./gitleaks dir . --no-banner --redact --exit-code 1
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: packages/mcp-trading/package-lock.json

      - name: mcp-trading — install, lint, format:check, typecheck, test, build
        working-directory: packages/mcp-trading
        run: |
          npm ci
          npm run lint
          npm run format:check
          npm run typecheck
          npm test
          npm run build

  # The hosted agent scheduler. Depends on @coinrithm/mcp-trading's built dist,
  # so build that first.
  scheduler:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: packages/scheduler/package-lock.json

      - name: Build the mcp-trading dependency first
        working-directory: packages/mcp-trading
        run: |
          npm ci
          npm run build

      - name: scheduler — install, lint, format:check, typecheck, test, build
        working-directory: packages/scheduler
        run: |
          npm ci
          npm run lint
          npm run format:check
          npm run typecheck
          npm test
          npm run build

  # The agent contract: the OpenAPI spec must be Redocly-clean (ZERO errors) and
  # the example bundles must parse.
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: OpenAPI lint — ZERO errors required
        # redocly exits non-zero on any error-severity problem; warnings do not
        # fail the build. This is a hard zero-error gate (was baseline-tolerant).
        run: NO_COLOR=1 npx -y @redocly/cli@2.32.0 lint openapi.yaml

      - name: Syntax-check examples (.mjs)
        run: |
          for f in examples/*.mjs examples/bots/*.mjs; do
            echo "node --check $f"
            node --check "$f"
          done

      - name: Syntax-check examples (.py)
        run: python3 -m py_compile examples/python/*.py

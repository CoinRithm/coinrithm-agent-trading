name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  docs-examples:
    uses: ./.github/workflows/docs-build.yml

  # The published npm SDK must be reproducible from the canonical contract.
  # Regeneration drift means consumers are missing declared fields even when
  # the OpenAPI document itself is correct.
  typescript-sdk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/sdk
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: packages/sdk/package-lock.json

      - name: TypeScript SDK — audit, regenerate, verify, package
        run: |
          npm ci
          npm audit --audit-level=high
          npm run generate
          git diff --exit-code -- src/schema.ts
          npm run typecheck
          npm run test:coverage
          npm run build
          npm pack --ignore-scripts

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: typescript-sdk-coverage
          path: packages/sdk/coverage
          if-no-files-found: error

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: typescript-sdk-package
          path: packages/sdk/*.tgz
          if-no-files-found: error

  # The published PyPI SDK: deterministic Python 3.12 environment, generated
  # client behavior, and installable artifacts. uv.lock is committed.
  python-sdk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/sdk-python
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install uv and Python 3.12
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.0"
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: packages/sdk-python/uv.lock

      - name: Python SDK — regenerate, test, compile, build
        run: |
          uv sync --locked
          uv run openapi-python-client generate \
            --path ../../openapi.yaml \
            --config openapi-python-client.yaml \
            --meta none \
            --output-path coinrithm_sdk \
            --overwrite \
            --fail-on-warning
          touch coinrithm_sdk/py.typed
          git diff --exit-code -- coinrithm_sdk
          uv run pytest -q
          uv run python scripts/check_coverage.py
          uv run python -m compileall -q coinrithm_sdk
          uv build
          uv run --isolated --no-project --with ./dist/coinrithm_sdk-*.whl \
            python -c "from coinrithm_sdk import Client; assert Client(base_url='https://api.coinrithm.com')"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: python-sdk-coverage
          path: packages/sdk-python/coverage
          if-no-files-found: error

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: python-sdk-package
          path: packages/sdk-python/dist/*.whl
          if-no-files-found: error

  # The published npm package: MCP server + agent runner (both live here).
  mcp-trading:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # Secret scan (audit reliability lane, 2026-08-11). A STEP inside the
      # main job, not a parallel job, and the plain binary rather than the
      # gitleaks-action - both lessons from the coinrithm frontend rollout
      # (2026-08-06): a separate job needed its own runner + checkout and was
      # routinely cancelled by follow-up pushes, making CI a false red; the
      # Docker-image action was too slow for the same reason. Config:
      # .gitleaks.toml (default ruleset in full + line-anchored allowlists for
      # verified false positives). Proven before landing: clean `git archive`
      # checkout scans exit 0, and a planted correctly-shaped canary PAT next
      # to an allowlisted line still fails the scan.
      - name: Secret scan
        run: |
          bash .github/scripts/install-release-tool.sh gitleaks
          ./gitleaks dir . --no-banner --redact --exit-code 1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: packages/mcp-trading/package-lock.json

      - name: mcp-trading — install, lint, format:check, typecheck, test, build
        working-directory: packages/mcp-trading
        run: |
          npm ci
          npm audit --audit-level=high
          npm run lint
          npm run format:check
          npm run typecheck
          npm run test:coverage
          npm run build
          npm pack --ignore-scripts

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: mcp-trading-coverage
          path: packages/mcp-trading/coverage
          if-no-files-found: error

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mcp-trading-package
          path: packages/mcp-trading/*.tgz
          if-no-files-found: error

  # The hosted agent scheduler. Depends on @coinrithm/mcp-trading's built dist,
  # so build that first.
  scheduler:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: local-ci-only
          POSTGRES_DB: capacity_admission_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d capacity_admission_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CAPACITY_TEST_DATABASE_URL: postgresql://postgres:local-ci-only@127.0.0.1:5432/capacity_admission_test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: packages/scheduler/package-lock.json

      - name: Build the mcp-trading dependency first
        working-directory: packages/mcp-trading
        run: |
          npm ci
          npm run build

      - name: scheduler — install, lint, format:check, typecheck, test, build
        working-directory: packages/scheduler
        run: |
          npm ci
          npm audit --audit-level=high
          npm run lint
          npm run format:check
          npm run typecheck
          npm run test:coverage
          npm run build

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: scheduler-coverage
          path: packages/scheduler/coverage
          if-no-files-found: error

  # The agent contract: the OpenAPI spec must be Redocly-clean (ZERO errors) and
  # the example bundles must parse.
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20

      - name: Verify the pinned registry publisher without publishing
        run: |
          bash .github/scripts/install-release-tool.sh mcp-publisher
          ./mcp-publisher --help

      - name: OpenAPI lint — ZERO errors required
        # redocly exits non-zero on any error-severity problem; warnings do not
        # fail the build. This is a hard zero-error gate (was baseline-tolerant).
        run: NO_COLOR=1 npx -y @redocly/cli@2.32.0 lint openapi.yaml

      - name: Syntax-check examples (.mjs)
        run: |
          for f in examples/*.mjs examples/bots/*.mjs; do
            echo "node --check $f"
            node --check "$f"
          done

      - name: Syntax-check examples (.py)
        run: python3 -m py_compile examples/python/*.py

  node-compatibility:
    needs: [mcp-trading, typescript-sdk]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [18, 20, 22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: "*-package"
          merge-multiple: true
          path: artifacts
      - name: Install archives and exercise startup and persistence
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/coinrithm install smoke"
          cp .github/scripts/package-smoke.mjs "$RUNNER_TEMP/coinrithm install smoke/"
          cp .github/scripts/lifecycle-smoke.mjs "$RUNNER_TEMP/coinrithm install smoke/"
          cd "$RUNNER_TEMP/coinrithm install smoke"
          printf '{"name":"coinrithm-compatibility","private":true,"type":"module"}' > package.json
          npm install --ignore-scripts "$GITHUB_WORKSPACE"/artifacts/*.tgz
          node package-smoke.mjs
          node lifecycle-smoke.mjs

  python-compatibility:
    needs: python-sdk
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, python: "3.10" }
          - { os: ubuntu-latest, python: "3.11" }
          - { os: ubuntu-latest, python: "3.12" }
          - { os: ubuntu-latest, python: "3.13" }
          - { os: ubuntu-latest, python: "3.14" }
          - { os: windows-latest, python: "3.12" }
          - { os: macos-latest, python: "3.12" }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.0"
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: python-sdk-package
          path: artifacts
      - name: Exercise installed wheel outside the source directory
        shell: bash
        run: |
          uv run --isolated --no-project --with ./artifacts/coinrithm_sdk-*.whl python .github/scripts/python-package-smoke.py

  compatibility:
    if: always()
    needs: [node-compatibility, python-compatibility]
    runs-on: ubuntu-latest
    steps:
      - name: Require every compatibility scenario to pass
        env:
          NODE_RESULT: ${{ needs.node-compatibility.result }}
          PYTHON_RESULT: ${{ needs.python-compatibility.result }}
        run: test "$NODE_RESULT" = success && test "$PYTHON_RESULT" = success

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # The published npm package: MCP server + agent runner (both live here).
  mcp-trading:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: packages/mcp-trading/package-lock.json

      - name: mcp-trading — install, lint, format:check, typecheck, test, build
        working-directory: packages/mcp-trading
        run: |
          npm ci
          npm run lint
          npm run format:check
          npm run typecheck
          npm test
          npm run build

  # The hosted agent scheduler. Depends on @coinrithm/mcp-trading's built dist,
  # so build that first.
  scheduler:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: packages/scheduler/package-lock.json

      - name: Build the mcp-trading dependency first
        working-directory: packages/mcp-trading
        run: |
          npm ci
          npm run build

      - name: scheduler — install, lint, format:check, typecheck, test, build
        working-directory: packages/scheduler
        run: |
          npm ci
          npm run lint
          npm run format:check
          npm run typecheck
          npm test
          npm run build

  # The agent contract: the OpenAPI spec must be Redocly-clean (ZERO errors) and
  # the example bundles must parse.
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: OpenAPI lint — ZERO errors required
        # redocly exits non-zero on any error-severity problem; warnings do not
        # fail the build. This is a hard zero-error gate (was baseline-tolerant).
        run: NO_COLOR=1 npx -y @redocly/cli@2.32.0 lint openapi.yaml

      - name: Syntax-check examples (.mjs)
        run: |
          for f in examples/*.mjs examples/bots/*.mjs; do
            echo "node --check $f"
            node --check "$f"
          done

      - name: Syntax-check examples (.py)
        run: python3 -m py_compile examples/python/*.py

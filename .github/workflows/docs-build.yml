name: Build and verify API examples

on:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: examples/clients/package-lock.json
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          version: "0.12.0"
          python-version: "3.12"
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.27.1"
          cache: false
      - name: Execute the displayed examples with published SDKs and a local HTTP fixture
        working-directory: examples/clients
        run: |
          npm ci --ignore-scripts
          uv venv .venv
          uv pip install --python .venv/bin/python -r requirements.txt
          npm test
      - name: Build the reference from this revision's contract and example files
        run: |
          npx -y @redocly/cli@2.32.0 bundle openapi.yaml --output _site/openapi.json
          node .github/scripts/build-docs.mjs
          npx -y @redocly/cli@2.32.0 lint _site/openapi.json
          node --test .github/scripts/docs-build.test.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: api-reference-site
          path: _site
          if-no-files-found: error

name: Deploy docs to GitHub Pages

# Publishes /docs (the Scalar-rendered API reference) to GitHub Pages.
# The page loads openapi.yaml from raw.githubusercontent.com at runtime, so it
# always reflects main without a rebuild — this workflow only needs to run
# when the docs shell itself changes.

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4

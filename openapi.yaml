        exists. No new data is stored for this summary.
      properties:
        schema:
          type: string
          examples: ["coinrithm.agentRunOutcomeSummary.v1"]
        mode: { type: string, examples: ["best_effort_related_entities"] }
        coverage: { type: string, enum: [none, partial, complete] }

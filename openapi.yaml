          description: "Catalog ticker, case-insensitive (`MSTR`)."
          schema: { type: string, pattern: "^[A-Za-z0-9]{1,20}$" }
      responses:
        "200":
          description: "Company holdings per coin, or a null treasury"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PublicTickerTreasuryResponse" }
        "400":
          description: "Invalid ticker or query parameter"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PublicMessageError" }
        "404":
          description: "Reference instrument not found"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PublicMessageError" }
        "429":
          description: "Public request rate limit exceeded; honor `Retry-After`."

  /api/market/references/{ticker}/filings:
    get:
      operationId: getPublicTradfiReferenceFilings
      tags: [public-market-data]
      summary: SEC Form 4 insider transactions for a reference
      description: |
        Keyless SEC EDGAR Form 4 insider transactions (non-derivative table)
        for one catalog ticker: up to 50 latest transactions of every code
        and up to 20 latest open-market purchases and sales (codes `P` and
        `S`), newest filing first. Every row links to its original filing
        on sec.gov. Form 4 is due within two business days of the trade, so
        `filedAt` can trail `transactionDate`.

        `coverage` is `not_applicable` for instruments that do not file
        Form 4 (metals, commodities, FX, non-US home listings),
        `none_recorded` when no transaction has been collected yet, and
        `available` otherwise. Dates are `YYYY-MM-DD` strings. Shares,
        prices and values are null when the filing omits them. A ticker
        outside the catalog returns 404. The response is shared-cached for
        about 10 minutes.
      security: []
      parameters:
        - name: ticker
          in: path
          required: true
          description: "Catalog ticker, case-insensitive (`MSTR`)."
          schema: { type: string, pattern: "^[A-Za-z0-9]{1,20}$" }
      responses:
        "200":
          description: "Insider and open-market transactions with source attribution"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PublicSecFilingsResponse" }
        "400":
          description: "Invalid ticker or query parameter"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PublicMessageError" }
        "404":
          description: "Reference instrument not found"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PublicMessageError" }
        "429":
          description: "Public request rate limit exceeded; honor `Retry-After`."
        "500":
          description: "Filings temporarily unavailable"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PublicMessageError" }

  /api/market/references/{ticker}/positioning:
    get:
      operationId: getPublicTradfiReferencePositioning
      tags: [public-market-data]
      summary: CFTC Commitments of Traders positioning for a reference
      description: |
        Keyless weekly CFTC Commitments of Traders positioning (legacy
        report, futures only) for a catalog ticker with a listed US futures
        equivalent: gold, silver, platinum, palladium, WTI and Brent crude,
        EUR/USD, GBP/USD, and the S&P 500 and Nasdaq-100 e-mini futures for
        `SPY` and `QQQ`. Up to 12 reports, newest first.

        Positions are as of each Tuesday (`reportDate`) and published the
        following Friday. Values are in contracts; net is long minus short.
        Non-commercial traders are mostly speculators, commercial traders
        hedge a business exposure. Week-over-week changes are CFTC's own
        and null when not published. Other catalog tickers answer 200 with
        `coverage: not_applicable`. `status` is `fresh` within 12 hours of
        CoinRithm's last read, `stale` up to 8 days, then `unavailable`
        with no reports; an upstream failure still answers 200. A ticker
        outside the catalog returns 404.
      security: []
      parameters:
        - name: ticker
          in: path
          required: true
          description: "Catalog ticker, case-insensitive (`XAU`, `SPY`)."
          schema: { type: string, pattern: "^[A-Za-z0-9]{1,20}$" }
      responses:
        "200":
          description: "Contract, weekly reports, freshness and attribution"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PublicCftcPositioningResponse" }
        "400":
          description: "Invalid ticker or query parameter"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PublicMessageError" }
        "404":
          description: "Reference instrument not found"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PublicMessageError" }
        "429":
          description: "Public request rate limit exceeded; honor `Retry-After`."

  /api/agent/spot/reference/{coinId}:
    get:
      operationId: getSpotReference
      tags: [spot]
      summary: Dated spot reference price for one coin (Binance stream or stored consensus)
      description: |
        Reference data only. Returns the Binance spot 24h-ticker last price
        (USDT) for the coin's single verified Binance/USDT mapping when a
        recent stream snapshot exists, plus the stored REST consensus price
        (USD) as an individually dated fallback. Both values keep their own
        units; `preferredSource` is not a USDT/USD conversion, an executable
        price or a paper-fill promise. Spot quotes, orders and market context
        never read this endpoint, so their prices are unchanged by it.

        The stream observation is refused (with `stream.reason`) unless the
        snapshot is connected, at most 10 s old, its universe metadata at
        most 10 min old, and the coin's identity and source policy match.
        `fallback.status` is `fresh` when the stored row was written at most
        120 s ago. Requires scope `read`. Any query parameter returns 400.
        Responses carry `Cache-Control: no-store`.
      parameters:
        - name: coinId
          in: path
          required: true
          schema: { type: string, pattern: "^[a-zA-Z0-9_-]{1,64}$" }
          description: Coin UCID (e.g. "1" = BTC). Use /api/agent/resolve to find it.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SpotReferenceResponse" }
        "400":
          description: Invalid coin id, or a query parameter was supplied.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: No coin with this UCID.
          content:
            application/json:
              schema:
                type: object
                required: [error, coinId]
                properties:
                  error: { type: string, examples: ["Coin not found"] }
                  coinId: { type: string }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "503":
          description: Database read failed; no fallback is guessed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/agent/universe:
    get:
      operationId: getAgentUniverse
      tags: [reads]
      summary: Screen coins inside market boundaries (rank band, volume, sectors)
      description: |
        Returns up to `limit` active coins inside the caller's boundaries:
        market-cap rank band, minimum 24h USD volume, optional stablecoin
        exclusion and curated sectors in/out (ids from
        /api/agent/universe/sectors). Coins flagged market-cap-suspect and
        coins whose live price is older than 72 h are never included. Sorts
        that need a change or volume value exclude coins where it is null.
        Ties break on market-cap rank, then UCID, so equal data gives equal
        order. A sector both included and excluded is excluded.

        Pass `ucids` to check whether specific coins are inside the same
        boundaries (membership check, at most 50 ids). Unknown query
        parameters are ignored. Pure market data on a shared 60 s URL-keyed
        cache, so `priceAgeHours` can lag the response time by up to a
        minute. Requires scope `read`.
      parameters:
        - name: rankMin
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 10000, default: 1 }
          description: Lowest market-cap rank included (inclusive). Must be <= rankMax.
        - name: rankMax
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 10000, default: 100 }
          description: Highest market-cap rank included (inclusive).
        - name: minVolume24hUsd
          in: query
          required: false
          schema: { type: number, minimum: 0, maximum: 10000000000000, default: 0 }
          description: Minimum 24h volume in USD; a null volume counts as 0.
        - name: excludeStablecoins
          in: query
          required: false
          schema: { type: string, enum: ["true", "false", "1", "0"], default: "false" }
          description: Excludes the `stablecoins` sector (same as listing it in excludeSectors).
        - name: includeSectors
          in: query
          required: false
          schema: { type: string, maxLength: 500 }
          description: |
            Comma-separated sector ids (case-insensitive); a coin must belong
            to at least one. Unknown ids return 400.
        - name: excludeSectors
          in: query
          required: false
          schema: { type: string, maxLength: 500 }
          description: Comma-separated sector ids to exclude. Unknown ids return 400.
        - name: sort
          in: query
          required: false
          schema:
            type: string
            enum: [gainers_24h, losers_24h, abs_change_24h, abs_change_1h, volume_24h, rank]
            default: abs_change_24h
        - name: ucids
          in: query
          required: false
          schema: { type: string, maxLength: 2000 }
          description: |
            Optional comma-separated coin UCIDs (1-50 ids, each matching
            `^[A-Za-z0-9_-]{1,64}$`) restricting the screen to these coins.
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentUniverseResponse" }
        "400":
          description: Invalid query (out-of-range number, unknown sector id, rankMin > rankMax, bad ucids, repeated parameter).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentUniverseValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "500": { $ref: "#/components/responses/ServerError" }

  /api/agent/universe/sectors:
    get:
      operationId: getAgentUniverseSectors
      tags: [reads]
      summary: Curated sector and ecosystem ids with live coin counts
      description: |
        The curated sector picker for /api/agent/universe: every sector and
        chain ecosystem id with its label and the number of distinct coins
        currently in it (active, not market-cap-suspect, live price at most
        72 h old). Each id maps to an explicit list of CoinRithm category
        names; ecosystem ids carry an `eco-` prefix. Takes no parameters.
        Shared 60 s cache. Requires scope `read`.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentUniverseSectorsResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "500": { $ref: "#/components/responses/ServerError" }

  /api/agent/pm/v2/discover:
    get:
      operationId: discoverPmPaperV2
      tags: [prediction-markets]
      summary: Discover candidates for the acquired-book PM paper model (pm_paper_v2)
      description: |
        Candidate list for `pm_paper_v2`, the paper model that fills against
        an order book acquired from the venue at entry time. Only keys
        enrolled as a server-configured house agent may call it; any other
        key receives 403 `house_opt_in_required`.

        Built from the same cached discovery set as /api/agent/pm/discover
        (all sources, `best` sort, offset 0), then filtered per request: an
        outcome is kept only when its exact stored native identity resolves
        (Polymarket condition + token, or Kalshi ticker + side), it is not a
        Polymarket negative-risk contract, and, when the house has a
        `maxEndDays` bound, its scheduled native end falls inside it. Events
        left with no outcome are dropped; `meta.boundedSelection` counts
        what was removed and why. Dates are stored provider fields, not a
        settlement guarantee; entry re-acquires identity, maturity, book and
        fees. Only `q` and `limit` are accepted; any other query parameter
        returns 400. The legacy `quoteHint` on each market still points at
        the v1 quote endpoint. Requires scope `read`.
      parameters:
        - name: q
          in: query
          required: false
          schema: { type: string, maxLength: 100 }
          description: Search text matched against event title, outcomes, topics, and related coins.
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
          description: Events requested before filtering (decimal, no leading zeros).
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PmPaperV2DiscoveryResponse" }
        "400":
          description: Unsupported or invalid query parameter (`invalid_discovery_query`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: Missing scope, or the key is not an enrolled house agent (`house_opt_in_required`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "503":
          description: Native discovery read failed (`pm_native_discovery_unavailable`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/agent/pm/v2/positions:
    get:
      operationId: getPmPaperV2Positions
      tags: [prediction-markets]
      summary: List this key's pm_paper_v2 positions with exact accounting
      description: |
        Newest-first page of the calling key's `pm_paper_v2` positions (v1
        positions stay on /api/agent/positions/pm), plus an unpaginated risk
        summary, the key's house enrollment and whether entry is enabled.
        Money and quantity are exact integer strings: `*Quanta6` values are
        paper mUSD x 1,000,000 and `quantityUnits2` is shares x 100. Payout,
        PnL and `terminal` stay null until the close or settlement is fully
        recorded (`accountingStatus: settled`). Any key with scope `read` may
        call it; a key that never opened a v2 position gets an empty page.
        Responses carry `Cache-Control: private, no-store`.
      parameters:
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 50, default: 25 }
        - name: beforeId
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 2147483647 }
          description: Cursor; pass the previous page's `nextBeforeId`.
        - name: status
          in: query
          required: false
          schema: { type: string, enum: [open] }
          description: Only `open` is accepted; omit for all statuses.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PmPaperV2PositionsResponse" }
        "400":
          description: Unknown query parameter or invalid page (`invalid_page`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "503":
          description: Position read failed (`pm_positions_unavailable`).
          content:
            application/json:
              schema:
                type: object
                required: [executionModel, error]
                properties:
                  executionModel: { type: string, const: pm_paper_v2 }
                  error: { type: string, examples: ["pm_positions_unavailable"] }

  /api/agent/pm/v2/open:
    post:
      operationId: openPmPaperV2
      tags: [prediction-markets]
      summary: Open a pm_paper_v2 position against an acquired venue book
      description: |
        Buys the selected side of one binary outcome on paper, priced from an
        order book and fee schedule acquired from the venue during the
        request. Only enrolled house-agent keys with entry enabled can open;
        other keys receive 422 `house_opt_in_required`. Requires scope
        `trade:pm` and counts against the trade-write limit.

        `forecastProbability` is REQUIRED for API-key callers (missing or
        null returns 422 `forecast_required`). It is your own probability
        that the BOUGHT side pays out. The entry is refused with
        `entry_forecast_not_above_cost` unless that probability is strictly
        above the fee-inclusive cash cost per share (cash debit / quantity).
        `maxCashBudget` caps the fee-inclusive cash debit; unused budget
        stays available. Numeric fields are decimal STRINGS; a JSON number
        is refused.

        `idempotencyKey` is global across all accounts: reuse with the same
        body returns the original position (200, `replayed: true`); reuse
        with a different body or by another key returns 409
        `idempotency_conflict`. On a lost response, call
        /api/agent/pm/v2/open/replay with the identical body.

        Every refusal returns HTTP 422 with `kind: refused` and a `reason`.
        `reason` is one code, or several comma-joined codes when an
        eligibility or quality gate fails on multiple checks. Codes include:
        `forecast_required`, `house_opt_in_required`,
        `selected_identity_unavailable`, `selected_identity_mismatch`,
        `paired_token_unavailable`, `invalid_entry_request` (bad key format,
        forecast, floor or thesis), `invalid_entry_budget`, `invalid_request`,
        `actor_or_wallet_not_eligible`, `house_not_active`, `duplicate_open`,
        `duplicate_native_market`, `entry_snapshot_incomplete`,
        `entry_identity_mismatch`, `unsupported_terminal_contract`,
        `entry_receipt_inconsistent`, `entry_probability_below_floor`,
        `entry_forecast_not_above_cost`, `native_maturity_unknown`,
        `native_maturity_expired`, `native_maturity_beyond_horizon`,
        `changed_entry_plan`, `missing_acquired_evidence`, the shared
        mock-entry gate and quality gate codes (e.g. `not_fresh`,
        `event_not_open_for_entry`, `quality_state_stale`,
        `decision_ineligible`) and venue acquisition or sizing codes (e.g.
        `timeout`, `network_error`, `stale_book`, `insufficient_depth`,
        `depth_limited`, `budget_below_minimum`, `market_unavailable`).
        Treat unknown codes as refusals.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PmPaperV2OpenRequest" }
      responses:
        "200":
          description: "Position opened, or idempotent replay of the same request (`replayed: true`)."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PmPaperV2Opened" }
        "400":
          description: |
            Body failed the shape check (`reason: invalid_request`): not an
            object, an unknown field (including `agentTrace`; send trace
            headers instead), wrong `source`/`side`, or a missing or
            over-long string field. Middleware errors use the `Error` shape.
          content:
            application/json:
              schema:
                oneOf:
                  - { $ref: "#/components/schemas/PmPaperV2Failure" }
                  - { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          description: idempotencyKey already used with a different request or by another key.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PmPaperV2Refused" }
        "422":
          description: Refused; see `reason`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PmPaperV2Refused" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "503":
          description: "Runtime error (`reason: pm_runtime_unavailable`); the outcome may be unknown, so replay before retrying with a new key."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PmPaperV2Failure" }

  /api/agent/pm/v2/open/replay:
    post:
      operationId: replayPmPaperV2Open
      tags: [prediction-markets]
      summary: Replay a pm_paper_v2 open by idempotency key without opening anything
      description: |
        Read-only recovery for a lost or timed-out open. Send the IDENTICAL
        body of the original open (the canonical request is compared,
        including `forecastProbability`). Never acquires a book or opens a
        position. Returns 200 with the original position when the receipt
        exists and matches, 404 with `replayMissing: true` when no position
        holds this key (the original open did not commit; a new open with
        the same key is safe), and 409 `idempotency_conflict` when the key
        belongs to a different request or caller. `forecastProbability` is
        not required here. Requires scope `trade:pm` and counts against the
        trade-write limit.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PmPaperV2OpenReplayRequest" }
      responses:
        "200":
          description: "The original open (`replayed: true`)."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PmPaperV2Opened" }
        "400":
          description: "Body failed the shape check (`reason: invalid_request`)."
          content:
            application/json:
              schema:
                oneOf:
                  - { $ref: "#/components/schemas/PmPaperV2Failure" }
                  - { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: "No receipt for this idempotency key (`reason: no_existing_receipt`, `replayMissing: true`)."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PmPaperV2Refused" }
        "409":
          description: The key belongs to a different request or caller (`idempotency_conflict`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PmPaperV2Refused" }
        "422":
          description: Other refusal (e.g. `house_opt_in_required` for an invalid actor).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PmPaperV2Refused" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "503":
          description: "Runtime error (`reason: pm_runtime_unavailable`)."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PmPaperV2Failure" }

  /api/agent/pm/v2/close:
    post:
      operationId: closePmPaperV2
      tags: [prediction-markets]
      summary: Request a full close of a pm_paper_v2 position
      description: |
        Records a durable request to close the WHOLE position (no partial
        close). The sale itself runs later on a server-side worker: it
        settles at the venue's proven final payout if the market has
        resolved, otherwise sells the exact held token against a freshly
        acquired book. A new request therefore returns 202 (`accepted:
        true`, `executed: false`); poll /api/agent/pm/v2/positions for
        `exit` and `terminal`. Only positions owned by the calling key are
        visible (others return 404). Entry flags and house enrollment do not
        block a close.

        `idempotencyKey` is global: the same key and body returns the
        existing intent (`replayed: true`, 200 once filled); a different
        body returns 409 `conflict`. If an exit intent is already active for
        the position, the new request attaches to it. Requires scope
        `trade:pm` and counts against the trade-write limit.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PmPaperV2CloseRequest" }
      responses:
        "200":
          description: "Replay of an exit that has already filled (`executed: true`)."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PmPaperV2CloseResult" }
        "202":
          description: "Exit accepted and pending execution (`executed: false`)."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PmPaperV2CloseResult" }
        "400":
          description: Unknown field, invalid positionId, idempotencyKey or detail (`invalid_exit_request`).
          content:
            application/json:
              schema:
                oneOf:
                  - { $ref: "#/components/schemas/Error" }
                  - { $ref: "#/components/schemas/PmPaperV2CloseResult" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: "No position with this id for the calling key (`kind: not_found`)."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PmPaperV2CloseResult" }
        "409":
          description: |
            `kind` is `not_v2` (a v1 position), `not_open`, `conflict` (key
            reused with a different body) or `cancelled` (the replayed intent
            was cancelled).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PmPaperV2CloseResult" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "503":
          description: "Request could not be recorded (`reason: exit_request_unavailable`); retry with the same key."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PmPaperV2Failure" }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Personal CoinRithm API key, format `crk_live_…`.

  responses:
    Unauthorized:
      description: Missing/malformed or invalid/revoked API key
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Forbidden:
      description: API key missing the required scope
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    BadRequest:
      description: Invalid or missing parameters
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    WalletNotFound:
      description: No active mock_spot wallet for this user
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    ServerError:
      description: Server error
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    TooManyRequests:
      description: |
        Rate limit exceeded for this API key (120 req/min baseline, 20
        trade-writes/min). Honor `Retry-After`, then resume; the
        `RateLimit-*` headers on every response let you pace proactively.
        (The platform also runs a per-IP limiter; its 429 body may be plain
        text rather than JSON.)
      headers:
        Retry-After:
          description: Seconds to wait before retrying.
          schema: { type: integer }
        RateLimit-Limit:
          description: Request budget for the current window.
          schema: { type: integer }
        RateLimit-Remaining:
          description: Requests remaining in the current window.
          schema: { type: integer }
        RateLimit-Reset:
          description: Seconds until the current window resets.
          schema: { type: integer }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    EntryBlocked:
      description: Entry blocked by the eligibility/risk gate
      content:
        application/json:
          schema:
            type: object
            properties:
              error: { type: string, examples: ["futures_entry_blocked", "mock_entry_blocked"] }
              blockReasons:
                type: array
                items: { type: string }

  schemas:
    Error:
      type: object
      properties:
        error: { type: string }
      required: [error]

    PublicPmSourceSlug:
      type: string
      enum: [polymarket, kalshi, rothera, limitless, smarkets, manifold, metaculus, predictit, futuur, myriad, forecastex, gemini]

    PublicPmSource:
      type: object
      additionalProperties: true
      properties:
        id: { $ref: "#/components/schemas/PublicPmSourceSlug" }
        name: { type: string }
        kind: { type: string }
        supportsTrading: { type: boolean }
      required: [id, name]

    PublicPmOutcome:
      type: object
      additionalProperties: true
      properties:
        externalMarketId: { type: string }
        name: { type: string }
        probability:
          type: [number, "null"]
          description: Provider-implied probability on a 0–100 scale (raw venue input; may include vig, so a book's outcomes can sum above 100). Execution eligibility and a usable quote are reported by the quote endpoint, not inferred from this field alone.
        normalizedProbability:
          type: [number, "null"]
          description: Vig-removed display probability on a 0–100 scale, proportionally normalized so a complete exclusive book sums to ~100. Null when the book is not a complete exclusive book (threshold ladders, partial catalogs, non-market sources). This is display context, not an execution quote.
        hasObservedPrice:
          type: boolean
          description: Optional source-data truth flag. `true` means a supported source observation validated a usable observed price, including numeric 0; `false` is emitted only for the Rothera explicit writer-null marker and means no usable observed price input. Omitted means unknown, legacy, or unsupported source data. This flag does not claim live pricing, liquidity, or tradability.
        priceBasis:
          type: string
          description: |
            Polymarket and Kalshi open outcomes only: what `probability` is.
            `unquoted` means never traded and no usable book, so `probability`
            is not a price (a Polymarket wide-book midpoint such as 48 on a
            3/93 book, or a stored 0 on Kalshi). `book_mid` is the order-book
            midpoint (Polymarket: a spread of 10 points or less; Kalshi: the
            venue's quote midpoint). `last_trade` is the last traded price
            (Polymarket uses it when the book is wider than 10 points). Absent
            on other venues, on settled outcomes and on responses served before
            2026-09-29. Like `hasObservedPrice`, it is not an execution quote;
            use the quote endpoint for tradability. A plain string, so a basis
            added later cannot break older clients: treat an unknown value as
            unknown.
        sourceObservation:
          type: [object, "null"]
          additionalProperties: false
          description: Optional bounded provenance for the stored outcome price. Null means the supported source marker was unavailable or explicitly null; it does not prove that the outcome has no price. Timestamps describe source evidence, not current freshness or executable liquidity.
          properties:
            version: { type: integer, description: Source-observation schema version; currently 1. }
            basis:
              type: string
              enum: [provider_quote, provider_trade, daily_clearing_mark, clearing_settlement, last_price_untimed]
            provider: { type: string, enum: [robinhood, forecastex, rothera] }
            observedAt: { type: [string, "null"], format: date-time }
            tradeDate: { type: [string, "null"], format: date }
          required: [version, basis, provider]
        priceChange24h:
          type: [number, "null"]
          description: "Signed outcome probability change in percentage points (-100 to +100; probabilities are 0 to 100), not a fraction or relative percent change. For example, 20% to 25.5% is +5.5 points. The nominal 24h field follows the venue's available lookback basis, which may be a previous-session close or an observed-window span rather than exactly 24 hours. Null means unavailable."
        lifecycle:
          type: [object, "null"]
          additionalProperties: true
          description: Per-outcome provider lifecycle evidence. Terminal states are results, not live quotes; an open state with providerAcceptingOrders=false is a paused quote.
          properties:
            state: { type: string, enum: [open, closed, resolved, voided, unknown] }
            providerAcceptingOrders: { type: [boolean, "null"] }
            entryBlockedByLifecycle: { type: boolean }
            isResult: { type: boolean }
            result: { type: [string, "null"], enum: [won, lost, voided, null] }
            basis: { type: string, enum: [provider, stored_winner, unknown] }
            closedAt: { type: [string, "null"], format: date-time }
            resolvedAt: { type: [string, "null"], format: date-time }
            observedAt: { type: [string, "null"], format: date-time }
        priorProbability:
          type: [object, "null"]
          additionalProperties: true
          description: Last stored provider quote before the outcome closed, when available.
          properties:
            value: { type: number, minimum: 0, maximum: 100 }
            asOf: { type: string, format: date-time }
            cutoff: { type: string, format: date-time }
        venueTerms:
          type: object
          additionalProperties: false
          description: Venue-published order and settlement terms; null values mean unavailable, unreported, or invalid.
          properties:
            orderMinSize:
              type: [number, "null"]
              minimum: 0
              description: Polymarket minimum order size in shares.
            tickSize:
              type: [number, "null"]
              exclusiveMinimum: 0
              maximum: 1
              description: Polymarket minimum probability increment as a ratio.
            feesEnabled:
              type: [boolean, "null"]
              description: Polymarket market fee flag.
            canCloseEarly:
              type: [boolean, "null"]
              description: Kalshi early-close capability.
            settlementTimerSeconds:
              type: [integer, "null"]
              minimum: 0
              maximum: 9007199254740991
              description: Kalshi venue-published settlement timer in seconds; not a guaranteed deadline after close.
          required: [orderMinSize, tickSize, feesEnabled, canCloseEarly, settlementTimerSeconds]
        quoteEvidence:
          type: [object, "null"]
          additionalProperties: true
          description: |
            Present only when the request sent `includeQuoteEvidence=1`. The
            stored venue book observation for Polymarket and Kalshi outcomes on
            a 0-100 scale (values outside 0-100 are served as null); null for
            other venues or when none is stored. Not an executable quote.
          properties:
            version: { type: integer }
            bid: { type: [number, "null"] }
            ask: { type: [number, "null"] }
            last: { type: [number, "null"] }
      required: [name]

    PublicPmEvent:
      type: object
      additionalProperties: true
      properties:
        id: { type: string }
        slug: { type: string }
        title: { type: string }
        marketSubtitle:
          type: string
          description: |
            Kalshi single-market (Yes/No) events only: the contract's subject as
            the venue labels it, e.g. "Over 2.5 maps" under the title
            "... : Total Maps". Yes and No resolve against this line. Absent
            when the venue gives none, when it is just "Yes", and on every
            other event; the Yes/No outcome names and the title are unchanged.
        description: { type: [string, "null"] }
        status: { type: string }
        startDate: { type: [string, "null"], format: date-time }
        endDate: { type: [string, "null"], format: date-time }
        resolvedAt: { type: [string, "null"], format: date-time }
        resolvedOutcomeExternalMarketId: { type: [string, "null"] }
        resolutionOutcomeBasis: { type: [string, "null"] }
        freshness:
          type: object
          additionalProperties: true
          description: Observation time, age and source-aware freshness state.
        volume: { type: [number, "null"] }
        volume24h: { type: [number, "null"] }
        liquidity: { type: [number, "null"] }
        bestBid: { type: [number, "null"] }
        bestAsk: { type: [number, "null"] }
        spread: { type: [number, "null"] }
        source: { $ref: "#/components/schemas/PublicPmSource" }
        priceChange24h:
          type: [number, "null"]
          description: "Signed event-level probability change in percentage points (-100 to +100; probabilities are 0 to 100), not a fraction or relative percent change. The representative contract or outcome and nominal 24h lookback basis vary by venue; this need not be the displayed leader or largest outcome move. The lookback may be a previous-session close or an observed-window span rather than exactly 24 hours. Use outcome.priceChange24h for a named outcome's change. Null means unavailable."
        priceChange7d:
          type: [number, "null"]
          description: "Signed event-level probability change over the venue's available seven-day lookback, in percentage points (-100 to +100; probabilities are 0 to 100), not a fraction or relative percent change. The representative contract or outcome varies by venue; this need not be the displayed leader or largest outcome move. Null means unavailable."
        probabilityBook:
          type: [object, "null"]
          additionalProperties: true
          description: "Book-level probability basis: `basis` is `normalized_complete_book` when outcomes carry normalizedProbability (with `rawSum` and `overroundPoints`), else `raw_quotes`."
        outcomes:
          type: array
          items: { $ref: "#/components/schemas/PublicPmOutcome" }
        representativeOutcome:
          anyOf:
            - $ref: "#/components/schemas/PublicPmOutcome"
            - type: "null"
          description: |
            Open events only; absent on closed, awaiting and resolved events and
            on responses that do not select it. The one outcome a headline quotes,
            chosen from the full current book and served as a complete outcome
            object (same identity, lifecycle, hasObservedPrice and raw
            probability as its row in `outcomes`). Null when no current outcome
            has a usable price. Served on event detail, and on compact list
            responses requested with `lead=representative`.
        representativeOutcomeBasis:
          type: string
          enum: [threshold_ladder_line, informative_leader]
          description: |
            Event detail only, open events only: the rule that chose
            representativeOutcome. `threshold_ladder_line` is a threshold
            ladder's line nearest 50% (a Kalshi strike ladder).
            `informative_leader` is the highest current outcome strictly inside
            5-95, else the highest; it is not necessarily the leading outcome.
        referenceProbability:
          type: [object, "null"]
          additionalProperties: true
          description: Canonical matched-venue reference with venue count and spread.
        decisionSupport:
          type: [object, "null"]
          additionalProperties: true
        quality:
          type: [object, "null"]
          additionalProperties: true
          description: Persisted truth-engine decision eligibility and reason codes.
        crossPlatform:
          type: array
          items:
            type: object
            additionalProperties: true
        outcomesTotal:
          type: integer
          description: Full outcome count when the outcome list was trimmed (`view=compact`, or matched/related events without `full=1`).
        availability:
          type: object
          additionalProperties: true
          description: |
            Event detail only, and only for an open event whose venue CoinRithm
            has paused: its prices stopped updating at `lastCollectedAt`.
            Absent otherwise.
          properties:
            status: { type: string, enum: [paused] }
            lastCollectedAt: { type: [string, "null"], format: date-time }
          required: [status, lastCollectedAt]
      required: [id, slug, title, status, source, outcomes]

    PublicPmEventsResponse:
      type: object
      additionalProperties: false
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/PublicPmEvent" }
        pagination:
          type: object
          additionalProperties: true
          properties:
            total:
              type: integer
              deprecated: true
              description: Never sent by the server; use `hasMore`.
            limit: { type: integer }
            offset: { type: integer }
            hasMore: { type: boolean }
        meta:
          type: object
          additionalProperties: true
      required: [data, pagination]

    PublicPmPagination:
      type: object
      additionalProperties: true
      properties:
        limit: { type: integer }
        offset: { type: integer }
        hasMore: { type: boolean }
      required: [limit, offset, hasMore]

    PublicPmResolutionOutcome:
      type: object
      additionalProperties: true
      description: The winning outcome as recorded at resolution.
      properties:
        externalMarketId: { type: string }
        name: { type: string }
        probability:
          type: number
          description: The winning outcome's provider-implied probability on a 0-100 scale, as last recorded.
        basis:
          type: string
          description: "How the winner was determined. Currently `source` (the venue's own resolved-outcome marker matched a stored outcome) or `final_probability` (no venue marker, but exactly one outcome closed at >=99.5). A plain string: treat an unknown value as unknown."
      required: [externalMarketId, name, probability, basis]

    PublicPmResolvedEntry:
      type: object
      additionalProperties: true
      properties:
        event: { $ref: "#/components/schemas/PublicPmEvent" }
        resolvedAt:
          type: [string, "null"]
          format: date-time
          description: Provider-verified resolution time. Null when not provider-verified; see resolvedAtVerified.
        resolvedAtVerified: { type: boolean }
        closedAt:
          type: [string, "null"]
          format: date-time
          description: A real observed close time (never a fabricated future date), used when resolvedAt is not provider-verified.
        resolutionOutcome: { $ref: "#/components/schemas/PublicPmResolutionOutcome" }
      required: [event, resolvedAtVerified, resolutionOutcome]

    PublicPmResolvedEventsResponse:
      type: object
      additionalProperties: false
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/PublicPmResolvedEntry" }
        pagination: { $ref: "#/components/schemas/PublicPmPagination" }
        meta:
          type: object
          additionalProperties: true
          properties:
            totalResolved:
              type: [integer, "null"]
              description: Null when minVolume is set (the archive count is not volume-filtered); see minVolume.
            minVolume:
              type: [number, "null"]
              description: Echoes the requested floor when set, else null.
            period:
              type: [object, "null"]
              additionalProperties: false
              properties:
                year: { type: integer }
                month: { type: [integer, "null"] }
          required: [totalResolved, minVolume, period]
      required: [data, pagination, meta]

    PublicPmSurpriseEntry:
      type: object
      additionalProperties: true
      properties:
        event: { $ref: "#/components/schemas/PublicPmEvent" }
        resolvedAt:
          type: [string, "null"]
          format: date-time
          description: Provider-verified resolution time. Null when not provider-verified; see resolvedAtVerified.
        resolvedAtVerified: { type: boolean }
        closedAt:
          type: [string, "null"]
          format: date-time
        resolutionOutcome: { $ref: "#/components/schemas/PublicPmResolutionOutcome" }
        surprise:
          type: object
          additionalProperties: true
          properties:
            t24hProbability:
              type: number
              description: Winning outcome's probability (0-100) roughly 24h before resolution.
            t7dProbability:
              type: [number, "null"]
              description: Winning outcome's probability (0-100) roughly 7 days before resolution; frequently null.
          required: [t24hProbability, t7dProbability]
      required: [event, resolvedAtVerified, resolutionOutcome, surprise]

    PublicPmSurprisesResponse:
      type: object
      additionalProperties: false
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/PublicPmSurpriseEntry" }
        window:
          type: string
          description: The window applied, echoed from the request (`7d`, `30d`, `90d` or `all`; unknown requests are served as `all`).
        pagination: { $ref: "#/components/schemas/PublicPmPagination" }
      required: [data, window, pagination]

    PublicPmExpiringEventsResponse:
      type: object
      additionalProperties: false
      properties:
        data:
          type: array
          description: Each row is a PublicPmEvent that additionally carries `expiresInMs` (integer, milliseconds from fetch time to endDate); PublicPmEvent's open additionalProperties allows the extra field.
          items: { $ref: "#/components/schemas/PublicPmEvent" }
        pagination: { $ref: "#/components/schemas/PublicPmPagination" }
        meta:
          type: object
          additionalProperties: true
          properties:
            totalExpiring: { type: integer }
            window:
              type: object
              additionalProperties: false
              properties:
                from: { type: string, format: date-time }
                to: { type: string, format: date-time }
              required: [from, to]
          required: [totalExpiring, window]
      required: [data, pagination, meta]

    PublicPmMicrostructureOutcome:
      type: [object, "null"]
      additionalProperties: true
      description: Which outcome this microstructure read describes; null when the event has neither an outcome name nor id.
      properties:
        name: { type: [string, "null"] }
        externalMarketId: { type: [string, "null"] }

    PublicPmOrderBookLevel:
      type: object
      additionalProperties: false
      properties:
        price: { type: number, minimum: 0, maximum: 1, description: "Probability 0-1, a fraction." }
        size: { type: number, minimum: 0, description: "Resting size in shares (Polymarket) or contracts (Kalshi)." }
      required: [price, size]

    PublicPmOrderBookAskEvidence:
      type: object
      additionalProperties: false
      description: Present only for Polymarket books; Kalshi books omit it.
      properties:
        validated:
          type: boolean
          description: Whether the supplied ask snapshot parsed as a valid non-empty book.
        receivedAt:
          type: string
          format: date-time
          description: This server's acquisition time, not an upstream trade time.
      required: [validated, receivedAt]

    PublicPmOrderBook:
      type: [object, "null"]
      additionalProperties: true
      description: Null when the source has no book endpoint or none is currently resting — a valid empty shape, not an error.
      properties:
        bid: { type: [number, "null"], minimum: 0, maximum: 1 }
        ask: { type: [number, "null"], minimum: 0, maximum: 1 }
        spread: { type: [number, "null"] }
        midpoint: { type: [number, "null"], minimum: 0, maximum: 1 }
        bids:
          type: array
          description: Bid levels, best (highest price) first.
          items: { $ref: "#/components/schemas/PublicPmOrderBookLevel" }
        asks:
          type: array
          description: Ask levels, best (lowest price) first.
          items: { $ref: "#/components/schemas/PublicPmOrderBookLevel" }
        askEvidence: { $ref: "#/components/schemas/PublicPmOrderBookAskEvidence" }
        receivedAt:
          type: [string, "null"]
          format: date-time
          description: When this server acquired the book (its own time, not a venue trade time).
        sideEvidence:
          type: object
          additionalProperties: true
          description: |
            True when that side's supplied levels validated completely and the
            book is not crossed (an explicit empty side is valid). A dated
            observation, not a fill or liquidity guarantee.
          properties:
            bid: { type: boolean }
            ask: { type: boolean }
      required: [bid, ask, spread, midpoint, bids, asks]

    PublicPmOrderBookResponse:
      type: object
      additionalProperties: false
      properties:
        source: { $ref: "#/components/schemas/PublicPmSourceSlug" }
        slug: { type: string }
        outcome: { $ref: "#/components/schemas/PublicPmMicrostructureOutcome" }
        orderBook: { $ref: "#/components/schemas/PublicPmOrderBook" }
      required: [source, slug, outcome, orderBook]

    PublicPmTrade:
      type: object
      additionalProperties: true
      properties:
        side:
          type: string
          description: "Normalized direction: buy/sell (Polymarket) or the venue's own taker-side label, e.g. yes/no (Kalshi). Plain string — new venues may add new labels."
        price: { type: number, minimum: 0, maximum: 1, description: "Probability 0-1, a fraction." }
        size: { type: number, minimum: 0, description: "Size in shares (Polymarket) or contracts (Kalshi)." }
        usdValue: { type: number, description: "Notional USD value, size * price." }
        outcome:
          type: [string, "null"]
          description: Outcome label when the venue reports one on the trade row, else null.
        who:
          type: [string, "null"]
          description: Public trader handle when the venue exposes one (Polymarket pseudonym); Kalshi trades always report null.
        timestamp: { type: string, format: date-time }
      required: [side, price, size, usdValue, outcome, who, timestamp]

    PublicPmTradesResponse:
      type: object
      additionalProperties: false
      properties:
        source: { $ref: "#/components/schemas/PublicPmSourceSlug" }
        slug: { type: string }
        outcome: { $ref: "#/components/schemas/PublicPmMicrostructureOutcome" }
        trades:
          type: array
          maxItems: 20
          description: Most recent trades, fixed server cap of 20; not client-configurable.
          items: { $ref: "#/components/schemas/PublicPmTrade" }
      required: [source, slug, outcome, trades]

    PublicPmOverviewResponse:
      type: object
      additionalProperties: false
      properties:
        stats:
          type: object
          additionalProperties: true
        highlights:
          type: object
          additionalProperties:
            type: array
            items: { $ref: "#/components/schemas/PublicPmEvent" }
        categories:
          type: array
          items: { type: [string, object] }
        bySource:
          type: array
          items:
            type: object
            additionalProperties: true
        byCategory:
          type: array
          items:
            type: object
            additionalProperties: true
        updatedAt: { type: string, format: date-time }
      required: [stats, highlights, categories, bySource, byCategory, updatedAt]

    PublicPmEventDetailResponse:
      type: object
      additionalProperties: true
      properties:
        event: { $ref: "#/components/schemas/PublicPmEvent" }
        snapshots:
          type: array
          items: { type: object, additionalProperties: true }
        relatedEvents:
          type: array
          items: { $ref: "#/components/schemas/PublicPmEvent" }
        crossSourceMatches:
          type: array
          items: { type: object, additionalProperties: true }
        resolution: { type: [object, "null"], additionalProperties: true }
        volumeHistory:
          type: array
          items: { type: object, additionalProperties: true }
        relatedNews:
          type: array
          items: { type: object, additionalProperties: true }
        recentWhaleTrades:
          type: array
          items: { $ref: "#/components/schemas/PublicPmWhaleTrade" }
        detailMode:
          type: string
          enum: [full, core]
          description: "`core` when `view=core` was requested; heavy sections are then empty."
        liteFallback:
          type: boolean
          description: Present (true) when the server served a reduced payload under load; the `X-CoinRithm-Lite` header is also set.
      required: [event]

    PublicPmWhaleTrade:
      type: object
      additionalProperties: true
      properties:
        source: { $ref: "#/components/schemas/PublicPmSourceSlug" }
        sourceName: { type: string }
        sourceIcon: { type: [string, "null"] }
        eventSlug: { type: string }
        eventTitle: { type: string }
        wallet:
          type: string
          description: Shortened display form of the wallet, not an identifier.
        walletAddress:
          type: [string, "null"]
          description: Full lower-cased public address; null on venues that anonymize traders.
        traderName: { type: [string, "null"] }
        side: { type: string }
        outcome:
          type: [string, "null"]
          description: Outcome label; null when the venue row carries none.
        marketQuestion:
          type: [string, "null"]
          description: Nested market question on multi-market events; null on older rows.
        usdValue: { type: number }
        price: { type: number }
        sourceMarketRef: { type: [string, "null"] }
        nativeValue:
          type: [number, "null"]
          description: Trade value in the venue's own currency, when it is not USD.
        nativeCurrency: { type: [string, "null"] }
        valueBasis: { type: [string, "null"], description: "How `usdValue` was derived from the venue value." }
        evidenceType: { type: string }
        evidenceRef: { type: [string, "null"] }
        evidenceUrl: { type: [string, "null"], format: uri }
        availability: { type: string, enum: [live, delayed, unavailable] }
        observedAt: { type: string, format: date-time }
        tradedAt: { type: [string, "null"], format: date-time }
        latencySeconds: { type: [number, "null"] }
        event:
          type: object
          additionalProperties: true
          description: The event this trade belongs to. Sent on `/whales` and SSE `whale` rows, not on event detail.
          properties:
            source: { type: string }
            slug: { type: string }
            title: { type: string }
            image: { type: [string, "null"] }
            sourceName: { type: string }
            sourceIcon: { type: [string, "null"] }
            marketOutcomes:
              type: [object, "null"]
              additionalProperties: true
              description: Outcome count and the top outcomes by probability, for a market-split display.
              properties:
                total: { type: integer }
                top:
                  type: array
                  items:
                    type: object
                    additionalProperties: true
                    properties:
                      name: { type: string }
                      probability: { type: number }
      required: [source, eventSlug, side, outcome, usdValue, price, evidenceType, availability, observedAt]

    PublicPmWhaleStats24h:
      type: object
      additionalProperties: true
      description: Trailing 24-hour aggregates over the full verified whale table, not only the 50-row tape.
      properties:
        count: { type: integer }
        totalUsd: { type: number }
        maxUsd: { type: number }
        bySource:
          type: array
          items:
            type: object
            additionalProperties: true
            properties:
              source: { type: string }
              count: { type: integer }
              totalUsd: { type: number }
              maxUsd: { type: number }
              p99Usd30d: { type: number, description: "99th percentile trade size over 30 days." }
        maxTrade:
          type: [object, "null"]
          additionalProperties: true
          description: The largest matched print. Verify `usdValue` against `maxUsd` before calling it the maximum; an unmatched print can exceed it.
      required: [count, totalUsd, maxUsd, bySource]

    PublicPmWhalesResponse:
      type: object
      additionalProperties: false
      properties:
        trades:
          type: array
          maxItems: 50
          items: { $ref: "#/components/schemas/PublicPmWhaleTrade" }
        minUsd:
          type: integer
          enum: [25000, 50000, 100000]
          description: The size tier applied; present only when `minUsd` was requested.
        stats24h:
          $ref: "#/components/schemas/PublicPmWhaleStats24h"
          description: Omitted when the aggregate is temporarily unavailable.
        coverage:
          type: array
          items:
            type: object
            additionalProperties: true
      required: [trades, coverage]

    PublicPmCoverage:
      type: object
      additionalProperties: true
      description: |
        Gate-2 coverage ledger for one venue. Every nullable field means
        "not known", never zero — do not render a null as 0 or as evidence
        of absence.
      properties:
        computedAt: { type: string, format: date-time }
        completenessClass:
          type: string
          enum: [open_sweep_exhausted, open_sweep_bounded, unknown]
          description: |
            What the LATEST catalog sweep observed. NOT a claim that the
            venue's lifetime universe is held — see universeVerified.
        universeVerified:
          type: boolean
          description: |
            True only when coverage has been externally verified against a
            venue-published total. Currently false for every venue.
        universeEstimate:
          type: [integer, "null"]
          description: Upstream-reported total where the venue exposes one.
        openUniverseVerified:
          type: boolean
          description: |
            True when the OPEN set has been reconciled against a venue-supplied
            total. This is a weaker but REAL claim than `universeVerified`,
            which covers the lifetime universe and is false everywhere. Do not
            read a false here as "unverified coverage" — read it as "the venue
            publishes no total we can check the open set against".
        openUniverseProviderTotal:
          type: [integer, "null"]
          description: |
            The venue-supplied count of open markets that `openUniverseEnumerated`
            was checked against. Null when the venue publishes no such total.
        openUniverseTotalBasis:
          type: [string, "null"]
          description: |
            How that total was obtained — `published_total` (the venue states a
            count) or `unpaginated_universe` (the venue returns its whole open
            set in one unpaginated response, so enumeration IS the total).
            Null when there is no total.
        openUniverseEnumerated:
          type: [integer, "null"]
          description: Open markets CoinRithm enumerated in the latest sweep.
        enumeratedTotal: { type: integer }
        openCount: { type: integer }
        closedCount: { type: integer }
        resolvedProviderCount: { type: integer }
        anyResolutionRate:
          type: [number, "null"]
          description: Closed events with ANY recorded resolution / closed events.
        providerResolutionRate:
          type: [number, "null"]
          description: Closed events with a PROVIDER-verified resolution / closed events.
        freshnessP50Seconds: { type: [integer, "null"] }
        freshnessP95Seconds: { type: [integer, "null"] }
        freshnessP99Seconds: { type: [integer, "null"] }
        catalogFirstSeenDay:
          type: [string, "null"]
          format: date
          description: When CoinRithm first saw this catalog. Not history depth.
        probabilityHistoryStartDay:
          type: [string, "null"]
          format: date
          description: |
            How far stored probability history actually reaches. Null when no
            probability history is held for the venue.
        historyStartDay:
          type: [string, "null"]
          format: date
          deprecated: true
          description: |
            DEPRECATED alias of `catalogFirstSeenDay`, still served so existing
            consumers do not break. The original name read as history DEPTH
            when it only ever meant "when we first saw the catalog"; migrate to
            `catalogFirstSeenDay` for that fact, or to
            `probabilityHistoryStartDay` if depth is what you actually want.
        resolutionCoverageRate:
          type: [number, "null"]
          deprecated: true
          description: |
            DEPRECATED alias of `anyResolutionRate`, still served so existing
            consumers do not break. It was previously read as provider-verified
            coverage, which overstated it — use `anyResolutionRate` for any
            recorded resolution, or `providerResolutionRate` for the verified
            subset.
        missingFieldRates:
          type: [object, "null"]
          additionalProperties: true
        approvedMatchCount: { type: [integer, "null"] }
        avgMatchConfidence: { type: [number, "null"] }
        lastFullReconciliationAt: { type: [string, "null"], format: date-time }

    PublicPmSourcesResponse:
      type: object
      additionalProperties: true
      properties:
        sources:
          type: array
          items:
            type: object
            additionalProperties: true
            properties:
              id: { type: string }
              name: { type: string }
              coverage:
                oneOf:
                  - { $ref: "#/components/schemas/PublicPmCoverage" }
                  - type: "null"
                description: Null until the ledger has computed for this venue.
      required: [sources]

    PublicPmEventRevision:
      type: object
      additionalProperties: true
      properties:
        id: { type: integer }
        field:
          type: string
          description: Dotted path of the corrected fact, e.g. resolution.winner.
        prevValue: {}
        nextValue: {}
        reasonCode:
          type: string
          description: |
            Stable machine code, never free text: resolution_set,
            resolution_reversal, resolution_cleared, resolution_time_corrected,
            resolution_state_changed, member_added, member_removed,
            orientation_changed, merged_into, split_from, created.
        effectiveAt:
          type: [string, "null"]
          format: date-time
          description: |
            When the change became true at the SOURCE. Null when the venue
            states none; never back-filled with the observation time.
        observedAt: { type: string, format: date-time }
        evidence:
          type: object
          additionalProperties: true
          description: |
            Provenance for this correction. runId and captureId are null for
            watch-lane resolution changes, which re-fetch a single event by id
            rather than deriving from a daily sweep capture.
          properties:
            runId: { type: [integer, "null"] }
            captureId: { type: [integer, "null"] }
            parserVersion: { type: [string, "null"] }
            matcherVersion: { type: [string, "null"] }
            buildSha: { type: [string, "null"] }
        supersedesId:
          type: [integer, "null"]
          description: The earlier revision of the same field this replaces.

    PublicPmEventRevisionsResponse:
      type: object
      additionalProperties: true
      properties:
        subjectKey:
          type: string
          description: Stable identity, "<sourceSlug>:<externalEventId>".
        revisions:
          type: array
          items: { $ref: "#/components/schemas/PublicPmEventRevision" }
        truncated:
          type: boolean
          description: |
            True when the newest-first revision page hit its cap. Reconstruction
            is unaffected — asOf reads its own complete, time-bounded set.
        asOf: { type: string, format: date-time }
        reconstructed:
          type: object
          additionalProperties: true
          description: |
            Field values CoinRithm was publishing at asOf, folded by
            OBSERVATION time. Present only when asOf is supplied.
      required: [subjectKey, revisions]

    PublicPmSourcesHealthResponse:
      type: object
      additionalProperties: false
      properties:
        asOf: { type: string, format: date-time }
        thresholds: { type: object, additionalProperties: true }
        summary: { type: object, additionalProperties: true }
        degraded:
          type: array
          description: Venues currently failing one or more health checks.
          items:
            type: object
            additionalProperties: true
        sources:
          type: array
          items:
            type: object
            additionalProperties: true
            properties:
              id: { $ref: "#/components/schemas/PublicPmSourceSlug" }
              name: { type: string }
              isActive: { type: boolean }
              lastIngestAt: { type: [string, "null"], format: date-time }
              lagSeconds: { type: [number, "null"] }
              freshness: { type: string }
              openEvents: { type: integer }
              totalEvents: { type: integer }
              catalog:
                type: object
                additionalProperties: true
                description: Latest sweep evidence and provider-bounded completeness truth.
              degraded:
                type: array
                items: { type: string }
                description: Empty when healthy; otherwise stable reason codes.
        enrichment: { type: object, additionalProperties: true }
      required: [asOf, summary, degraded, sources]

    PublicPmDisagreementsResponse:
      type: object
      additionalProperties: false
      properties:
        data:
          type: array
          description: |
            Graph-clustered disagreement rows. Each cluster carries clusterId,
            primaryEventId, title, events[] (PublicPmEvent rows), comparisons[]
            (per-pair matchId/confidence/matchMethod/divergence + a comparison
            with per-outcome eventAProbability/eventBProbability/deltaPoints),
            maxOverallGap, maxOutcomeGap, maxConfidence, and referenceProbability
            when available.
          items:
            type: object
            additionalProperties: true
        total: { type: integer }
        hasMore: { type: boolean }
        pagination:
          type: object
          additionalProperties: true
          properties:
            limit: { type: integer }
            offset: { type: integer }
            nextOffset: { type: [integer, "null"] }
        meta:
          type: object
          additionalProperties: true
      required: [data, total, hasMore, pagination]

    PublicPmCalibrationResponse:
      type: object
      additionalProperties: false
      properties:
        leadHours: { type: number }
        minSample: { type: integer }
        methodology: { type: string }
        scored:
          type: array
          items:
            type: object
            additionalProperties: true
            properties:
              source: { type: string }
              name: { type: string }
              sampleSize:
                type: integer
                description: >-
                  Events actually scored: those whose t-24h snapshot captured
                  the market's COMPLETE outcome book. Read alongside `excluded`
                  — the exclusion rate differs sharply by venue, so sampleSize
                  is not comparable across venues on its own.
              calibrationError: { type: number }
              meanWinnerConfidence: { type: number }
              excluded:
                type: object
                additionalProperties: true
                description: >-
                  Cohort events NOT scored, by reason. Published so a consumer
                  can see how much of a venue's corpus stands behind the number.
                properties:
                  noLeadPoint:
                    type: integer
                    description: No timeline point at or before resolvedAt - 24h.
                  partialBookAtLead:
                    type: integer
                    description: >-
                      The t-24h snapshot held only part of the event's outcome
                      set. Scoring those would condition inclusion on whether
                      the eventual winner happened to be captured.
                  winnerNotAnOutcome:
                    type: integer
                    description: >-
                      Complete book, but the declared winner is not one of the
                      event's outcomes — a resolution-provenance defect.
                  invalidLeadPoint:
                    type: integer
                    description: The lead-window capture failed validation.
                  nonExclusiveBook:
                    type: integer
                    description: >-
                      Complete lead book without a recorded single-winner
                      structure, so one stored winner cannot score the other
                      outcomes.
                  unpricedMassBook:
                    type: integer
                    description: >-
                      Complete single-winner book whose prices sum below the
                      complete-book minimum (probability mass no outcome carries).
              reliability:
                type: array
                items:
                  type: object
                  additionalProperties: true
                  properties:
                    bucket: { type: string }
                    predictedMean: { type: number }
                    realizedRate: { type: number }
                    pairs: { type: integer }
        pending:
          type: array
          items:
            type: object
            additionalProperties: true
            properties:
              source: { type: string }
              name: { type: string }
              reason: { type: string }
              excluded:
                type: object
                additionalProperties: true
                description: Same exclusion counts as on `scored` rows, when computed.
        methodologyVersion:
          type: string
          description: Version of the calibration methodology that produced this payload.
        finalPrice:
          $ref: "#/components/schemas/PublicPmCalibrationSeries"
          description: |
            Optional second series scored on the venue-reported final
            pre-resolution price (`basis: venue_final_preresolution_price`).
            Lead time is unknown and not uniform, so it is not comparable with
            `scored`. Absent on older snapshots.
        ownCapture:
          $ref: "#/components/schemas/PublicPmCalibrationSeries"
          description: |
            Optional third series scored on CoinRithm's own last capture before
            resolution (`basis: own_last_preresolution_capture`). Its lead time
            is typically minutes (see `medianLeadSeconds`), so it is a
            near-final-price integrity check, not forecast skill. Absent on
            older snapshots.
      required: [leadHours, minSample, scored, pending]

    PublicPmCalibrationSeries:
      type: object
      additionalProperties: true
      properties:
        methodology: { type: string }
        minSample: { type: integer }
        scored:
          type: array
          items:
            type: object
            additionalProperties: true
            properties:
              source: { type: string }
              name: { type: string }
              basis: { type: string }
              sampleSize: { type: integer }
              calibrationError: { type: number, description: "Expected calibration error, 0-1 (lower is better)." }
              meanWinnerConfidence: { type: number, description: "Mean probability assigned to the eventual winner, 0-1." }
              medianLeadSeconds: { type: [number, "null"], description: "`ownCapture` only: median seconds between the scored capture and resolution." }
              p90LeadSeconds: { type: [number, "null"], description: "`ownCapture` only: 90th percentile of that lead." }
              reliability:
                type: array
                items:
                  type: object
                  additionalProperties: true
                  properties:
                    bucket: { type: string }
                    predictedMean: { type: number }
                    realizedRate: { type: number }
                    pairs: { type: integer }
              byYear:
                type: array
                items:
                  type: object
                  additionalProperties: true
                  properties:
                    year: { type: integer }
                    sampleSize: { type: integer }
                    calibrationError: { type: number }
                    meanWinnerConfidence: { type: number }
      required: [methodology, minSample, scored]

    PublicPmCanonicalListResponse:
      type: object
      additionalProperties: false
      properties:
        data:
          type: array
          items:
            type: object
            additionalProperties: true
            properties:
              uuid: { type: string }
              slug: { type: string }
              title: { type: string }
              revision: { type: integer }
              status: { type: string }
              memberCount: { type: integer }
              createdAt: { type: string, format: date-time }
              updatedAt: { type: string, format: date-time }
        pagination:
          type: object
          additionalProperties: true
          properties:
            limit: { type: integer }
            nextCursor: { type: [integer, "null"] }
      required: [data, pagination]

    PublicPmCanonicalDetailResponse:
      type: object
      additionalProperties: false
      properties:
        canonical:
          type: object
          additionalProperties: true
        mergedInto:
          type: [object, "null"]
          additionalProperties: true
        consensus:
          anyOf:
            - $ref: "#/components/schemas/PublicPmCanonicalConsensus"
            - type: "null"
          description: |
            Current cross-venue consensus for this question, or null when no
            open member holds a current reference that passes selection. Absent
            on a merged canonical.
        consensusHistory:
          type: array
          description: |
            Daily consensus tape, oldest first, up to 90 days. A series is
            returned only when one outcome identity holds for the whole window;
            otherwise it is empty. Each point carries its own row's identity.
            Absent on a merged canonical.
          items: { $ref: "#/components/schemas/PublicPmCanonicalConsensusPoint" }
        members:
          type: array
          items:
            type: object
            additionalProperties: true
            properties:
              source: { type: string }
              sourceName: { type: string }
              eventSlug: { type: string }
              eventTitle: { type: string }
              eventStatus: { type: string }
              isAnchor: { type: boolean }
              orientation: { type: string, enum: [same, flipped, unknown] }
              confidence: { type: number }
              basis: { type: [string, "null"] }
        lineage:
          type: array
          items:
            type: object
            additionalProperties: true
      required: [canonical, members, lineage]

    PublicPmCanonicalConsensus:
      type: object
      additionalProperties: false
      description: |
        The cross-venue reference probability for one canonical question. Every
        open member holding a current reference must agree on the full tuple
        (cluster, kind, outcome, probability, venueCount, spread); a binary
        reference additionally needs every holder aligned with the canonical
        anchor. Any disagreement yields null instead of a pick.
      properties:
        kind:
          type: string
          enum: [binary, leader]
          description: binary = the Yes side; leader = the leading named outcome.
        outcomeName:
          type: [string, "null"]
          description: Label of the leading outcome; null for a binary reference.
        probability:
          type: number
          description: Consensus probability in percent (0-100).
        venueCount:
          type: integer
          description: Number of venues that contributed a voice.
        spreadPoints:
          type: number
          description: Cross-venue spread in probability points.
        computedAt:
          type: string
          format: date-time
          description: Validated computation (heartbeat) time, not a quote or trade time.
        methodologyVersion:
          type: string
          examples: ["consensus_probability_v2"]
        listings:
          type: array
          description: |
            Public listings of member events that hold this reference. May be a
            subset of the contributing venues and may include several listings
            of one venue; its length is not venueCount.
          items:
            type: object
            additionalProperties: false
            properties:
              source: { type: string }
              eventSlug: { type: string }
            required: [source, eventSlug]
      required:

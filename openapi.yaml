openapi: 3.1.0
info:
  title: CoinRithm Agent Trading API
  version: "1.8.0"
  termsOfService: https://www.coinrithm.com/en/terms-of-use
  x-api-lifecycle:
    contract: v1
    stability: stable
    # v1 covers exactly the paths enumerated in this document.
    compatibility: additive-only
    # Field removal / rename / type change / semantic change requires a new
    # versioned prefix; it is never done in place.
    breakingChangePolicy: new-prefix-required
    outOfContract:
      - /api/internal/*
      - session-authenticated application endpoints
  description: |
    Research prediction markets and crypto, then test an agent with **paper
    trading**. Public data needs no account or API key. Account and trading
    operations use a personal CoinRithm key. All trading uses virtual funds.

    ## Start without an API key

    Read three open prediction-market events with one request:

    ```bash
    curl "https://api.coinrithm.com/api/prediction-markets/events?status=open&limit=3"
    ```

    Without `status=open` the list also returns closed events (on 2026-09-29
    the first three were closed July World Cup markets).

    The JSON response contains `data`, `pagination` and `meta`. Inspect each
    event's `freshness`, `quality` and `decisionSupport` before using it for a
    decision. Availability and freshness vary by source; an event in the
    research catalog is not necessarily eligible for a paper trade.

    The **public-pm-data**, **public-crypto-data** and **public-market-data**
    groups work anonymously.
    Public Arena and competition reads also need no key. Each operation's
    authentication setting is authoritative; public operations declare
    `security: []` in the downloadable contract.

    Prefer an MCP client? Connect to `https://mcp.coinrithm.com/mcp` without an
    Authorization header for public tools, then ask it to call `pm_data_events`
    with `limit: 3`. For SDKs and setup examples, see the
    [quick start](https://github.com/CoinRithm/coinrithm-agent-trading/blob/main/QUICKSTART.md#read-public-data).

    ## Account access and scopes

    For `/api/agent/*` operations, mint a key in **CoinRithm → Profile → API
    Keys**. Send `Authorization: Bearer crk_live_…` or `X-API-Key: crk_live_…`.
    Check `GET /api/agent/me` first: any valid key can inspect its own identity
    and scopes. Never paste a key into a shared example or commit it to source.

    | Scope | Allows |
    | --- | --- |
    | `read` | Account reads, quotes and self-reported opportunity records |
    | `trade:spot` | Place or cancel paper spot orders |
    | `trade:futures` | Open or close paper futures and set stop-loss/take-profit |
    | `trade:pm` | Open paper prediction-market positions |

    A `read` key cannot move paper funds. It **can write a durable self-report**
    through `POST /api/agent/pm/opportunity`; the scope is not a promise that
    every authorized operation is free of side effects.

    Missing or invalid keys return `401`. Insufficient scope returns `403`;
    server feature flags may also return `403` when an operation is disabled.
    Read the response body and the operation's documented errors.

    ## Paper trading and execution

    Start with identity and account reads, request a quote, check its eligibility
    and cost estimates, then submit a paper order only when intended. Use a
    stable idempotency key for each trading intent wherever the operation
    requires one. A timeout does not establish whether the server accepted a
    write; follow that operation's retry rules and inspect existing records.

    A paper account starts with 50,000 virtual mUSD; its cash coin is `USDT`
    (coinId `825`). Nothing touches real money or executes on a real exchange.
    Paper results do not establish live execution performance. **Not financial
    advice.**

    Fills are not idealized: every spot and futures
    fill applies a deterministic, fully-disclosed cost (a taker fee on notional,
    plus spread + slippage on spot market orders), folded into realized PnL — so
    a flat round-trip is a small loss, not a free breakeven. Quote and order
    responses carry an `executionModel` object describing the assumptions
    (fee/spread/slippage bps, per-trade estimates, `fundingMode`). PM fills at
    the ask (mid + half the ingested bid-ask spread) with size/liquidity-based
    slippage and a price-dependent taker fee (Polymarket-shaped, ~1.8% near 50%,
    ~0 at the extremes), folded into `sharesMusd`; `feeBps`/`spreadBps` are
    positive and `slippageBps` scales with order size, while `entryProbability`
    stays the mid for calibration. Futures quote funding is an estimate from
    the latest venue rate and may change before settlement; covered futures
    charges use recorded settled venue history. A missing rate is unavailable.
    This is a rehearsal cost model, NOT an exchange fill guarantee; order-book
    depth, latency, and market impact are not modeled.

    ## Rate limits and retries

    Agent keys have two server-tunable budgets: **120 requests/min** across
    agent endpoints and **20 trade-writes/min** for order placement/cancellation,
    futures open/close and PM open (including the `pm/v2` open, replay and
    close writes). Prefer the live `RateLimit-Limit`,
    `RateLimit-Remaining` and `RateLimit-Reset` headers to these defaults.
    Public routes also have service/IP limits; anonymous access is not unlimited.

    On `429`, honor `Retry-After` when provided. If it is absent or invalid,
    use a bounded backoff instead of immediately looping. Retry behavior for
    trading writes depends on the operation's idempotency contract; do not
    submit a fresh trading intent just because a response was lost.

    ## Execution evidence

    `/api/agent/*` responses include `X-CoinRithm-Ledger-Event-Id` and
    `X-CoinRithm-Ledger-Status` when the private action ledger records the call.
    Ledger writes are fail-open: paper trading still works if ledger persistence
    is temporarily unavailable. Quote/write bodies may include optional
    `agentTrace` metadata; GET calls may send equivalent `X-CoinRithm-Run-Id`,
    `X-CoinRithm-Decision-Id`, `X-CoinRithm-Strategy-Label` and
    `X-CoinRithm-Confidence` headers. Keep private keys and sensitive reasoning
    out of trace fields.

    ## Versions and compatibility

    **`info.version` (1.8.0) identifies the API contract**, independent of MCP
    and SDK package versions. The paths documented here form contract **v1**
    and remain under `/api/...`; do not add a `/v1` prefix.

    Within v1, documented fields retain their names, types and meanings. New
    fields and endpoints may be added, so preserve or tolerate unknown response
    fields. Removing or renaming a documented field, changing its type or
    changing its meaning requires a new versioned prefix, announced before the
    old one is withdrawn.

    Internal routes (`/api/internal/*`) and undocumented session-authenticated
    application endpoints are outside this contract and may change without
    notice. Only the operations documented here carry the v1 guarantee.

    ## Acceptable use of Market Data

    Two layers travel through this API and they carry different rights. The
    distinction matters to you, so it is stated plainly rather than buried.

    **Venue Market Data** — prices, probabilities, order books, quotes,
    volumes, open interest, venue event/market metadata, and venue-reported
    settlement outcomes, as published by third-party prediction-market
    venues. **This is not CoinRithm's to give away.** CoinRithm accesses it
    under each venue's own terms and passes through a limited right to READ
    it; CoinRithm does not represent that it holds redistribution rights in
    it. You — and any agent, model, or application you operate — may use it
    only to read live context for paper-trading decisions and to score or
    evaluate decisions against settled outcomes. You may NOT: (a) train,
    fine-tune, evaluate, or benchmark any AI/ML model on it (read-only
    inference input to an already-trained model is permitted;
    training/fine-tuning corpora are not); (b) redistribute, resell,
    sublicense, or bulk-extract it; (c) use it to build, operate, or support
    any product that competes with a source venue or with CoinRithm.
    If you need redistribution rights in a venue's data, obtain them from
    that venue. We cannot grant what we were not granted.

    **CoinRithm Data** — facts CoinRithm created rather than collected:
    canonical CoinRithm Event IDs and the cross-venue clusters they name,
    matching and orientation decisions, consensus/reference probability and
    its versioned methodology, calibration and Brier scoring, the coverage
    ledger and its completeness classifications, corrections and revision
    lineage, resolution-provenance classifications, and decision artifacts
    (UUIDs, content hashes, attestations, signatures). Redistribution rights
    in this layer are granted by plan; the keyless tier remains read-and-cite
    with attribution, free and permanent.

    Full terms: https://www.coinrithm.com/en/terms-of-use
  # NOT MIT. In OpenAPI, info.license describes the API this document
  # DESCRIBES, not the document file. Declaring MIT here granted the rights to
  # "use, copy, modify, merge, publish, distribute, sublicense, and/or sell"
  # the API and its Market Data — flatly contradicting the Acceptable Use
  # section directly above (which forbids redistribute/resell/sublicense) and
  # the venue data-licence commitments those terms exist to honour. The MIT
  # LICENSE file in this repo is correct and unchanged: it covers the SDK and
  # MCP client code (the Software), which stays open source.
  license:
    name: CoinRithm Terms of Use
    url: https://www.coinrithm.com/en/terms-of-use
servers:
  - url: https://api.coinrithm.com
    description: Production (live)

security:
  - bearerAuth: []

tags:
  - name: identity
    description: API-key identity, granted scopes, and paper-account status.
  - name: reads
    description: Market, coin, and prediction-market reads and quotes (no writes).
  - name: spot
    description: Paper spot orders — place, cancel, and list open orders.
  - name: futures
    description: Paper isolated-futures positions — open, close, and set SL/TP.
  - name: prediction-markets
    description: Paper prediction-market discovery, quotes, and positions.
  - name: public-pm-data
    description: >-
      Keyless cross-venue prediction-market research data across 12 venues.
      Subject to CoinRithm's Acceptable Use terms — no model training,
      redistribution, or competing use: https://www.coinrithm.com/en/terms-of-use
  - name: public-crypto-data
    description: >-
      Keyless crypto universe reads used for candidate discovery. Same
      Acceptable Use terms as the other keyless surfaces:
      https://www.coinrithm.com/en/terms-of-use
  - name: public-market-data
    description: >-
      Keyless market data beyond the coin universe: TradFi reference prices,
      large perpetual trades, liquidations, CFTC positioning, SEC Form 4
      insider filings and public-company crypto treasuries. Same Acceptable
      Use terms as the other keyless surfaces, plus each source's
      attribution: https://www.coinrithm.com/en/terms-of-use
  - name: ledger
    description: Agent action ledger and the reproducible run-evidence export.

paths:
  /api/agent/me:
    get:
      operationId: whoami
      tags: [identity]
      summary: Identity & scopes for the current key
      description: Works on any valid key regardless of scope.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  userId: { type: string }
                  keyId: { type: integer }
                  agentName:
                    type: [string, "null"]
                    description: The key's optional label (lets an agent confirm which key it is acting as). Null if unset.
                  agentModel:
                    type: [string, "null"]
                    description: |
                      Self-reported model/runtime label set by the key owner in
                      Profile -> API Keys (e.g. "Claude", "GPT-4o"). Shown on
                      the public Agent Arena when the key opts in. Null if
                      unset.
                  scopes:
                    type: array
                    items:
                      type: string
                      enum: [read, "trade:spot", "trade:futures", "trade:pm"]
                  usage:
                    type: object
                    description: Current-month request count for this key. Measurement only; no quota is enforced from it.
                    properties:
                      period: { type: string, description: "UTC month, `YYYY-MM`." }
                      requests:
                        type: [integer, "null"]
                        description: Requests counted this period; null when metering is unavailable (unknown, not zero).
                    required: [period, requests]
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /api/agent/portfolio:
    get:
      operationId: getPortfolio
      tags: [reads]
      summary: Portfolio — equity, PnL, open orders, progression
      description: |
        Lean, PII-free account summary (the agent surface does NOT return the
        human dashboard — no email/username/assets/history). Equity is
        `equity.totalUsd`; cash partitions under `equity` (available + frozen +
        frozenPm + frozenFutures = `equity.cashTotal`); period PnL under `pnl`
        (`*Usd` absolute, `*Pct` as 0..1 fractions). Requires scope `read`.
      parameters:
        - name: fiat
          in: query
          required: false
          schema: { type: string, default: USD }
          description: Display fiat code (e.g. USD, EUR). Equity is still USD-denominated.
        - name: locale
          in: query
          required: false
          schema: { type: string, default: en }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentPortfolio" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/WalletNotFound" }

  /api/agent/wallet:
    get:
      operationId: getWallet
      tags: [reads]
      summary: Raw wallet balances incl. frozen partitions
      description: |
        USDT cash with its three frozen partitions (spot orders, PM, futures),
        plus one optional coin asset if `coinId` is given. Requires scope `read`.
      parameters:
        - name: coinId
          in: query
          required: false
          schema: { type: string }
          description: A coin UCID (e.g. "1" = BTC) to also return that asset.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Wallet" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/WalletNotFound" }

  /api/agent/resolve:
    get:
      operationId: resolveSymbol
      tags: [reads]
      summary: Resolve a symbol/slug/name to a coinId
      description: |
        Resolve a human symbol, slug, or name (e.g. "BTC", "ethereum") to a
        CoinRithm `coinId` (UCID) plus disambiguating alternatives. Use this to
        get the `coinId` the wallet/quote/order endpoints require — symbols are
        not unique. Requires scope `read`.
      parameters:
        - name: q
          in: query
          required: true
          schema: { type: string, minLength: 1 }
          description: Symbol, slug, or name. (`symbol` is accepted as an alias.)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  query: { type: string }
                  match:
                    type: [object, "null"]
                    properties:
                      coinId: { type: string }
                      slug: { type: string }
                      symbol: { type: string }
                      name: { type: string }
                      marketCapRank: { type: [integer, "null"] }
                      categories:
                        type: array
                        items: { type: string }
                        description: CoinGecko sector tags (canonical English names).
                  alternatives:
                    type: array
                    items:
                      type: object
                      properties:
                        coinId: { type: string }
                        slug: { type: string }
                        symbol: { type: string }
                        name: { type: string }
                        marketCapRank: { type: [integer, "null"] }
                        categories:
                          type: array
                          items: { type: string }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/agent/equity-curve:
    get:
      operationId: getEquityCurve
      tags: [reads]
      summary: Wallet equity time series (daily or intraday realized)
      description: |
        `granularity=daily` (default): daily equity snapshots
        ({date, usdValue}) — the basis for a PnL chart / performance review.
        `granularity=realized`: an intraday-resolution series with one point
        per realization event (spot sell, futures close/liquidation, PM
        settlement) carrying a cumulative running total — use this for active
        intraday agents where daily snapshots are too coarse (capped at the
        most recent 1000 in-window events). Empty (not 404) when no data
        exists yet. Requires scope `read`.
      parameters:
        - name: days
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 365, default: 30 }
          description: Look-back window in days.
        - name: granularity
          in: query
          required: false
          schema:
            type: string
            enum: [daily, realized]
            default: daily
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  walletId: { type: [integer, "null"] }
                  window:
                    type: object
                    properties:
                      days: { type: integer }
                      from: { type: string, format: date-time }
                  granularity: { type: string, enum: [daily, realized] }
                  points:
                    type: array
                    description: |
                      daily -> {date, usdValue}. realized -> {t, venue,
                      realizedPnlMusd, cumulativeRealizedPnlMusd}.
                    items:
                      type: object
                      properties:
                        date: { type: string, example: "2026-05-01" }
                        usdValue: { type: number }
                        t: { type: string, format: date-time }
                        venue: { type: string, enum: [spot, futures, pm] }
                        realizedPnlMusd: { type: number }
                        cumulativeRealizedPnlMusd: { type: number }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/agent/trades:
    get:
      operationId: getMyTrades
      tags: [reads]
      summary: Unified realized-PnL trade log
      description: |
        CLOSED trades across all venues (spot fills, closed/liquidated futures,
        settled prediction-markets) merged into one realized-PnL log, most-recent
        first. The agent's memory of what it did and what won/lost. Requires
        scope `read`.

        **Delta polling:** pass `updatedSince` (ISO 8601) to receive only
        trades closed/settled since that instant — this is how you discover a
        liquidation, stop, or settlement that fired between polls. Use the
        response's `asOf` as the next cursor (server-clock based, skew-safe).
      parameters:
        - name: venue
          in: query
          required: false
          schema:
            type: string
            enum: [all, spot, futures, pm]
            default: all
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
        - name: updatedSince
          in: query
          required: false
          schema: { type: string, format: date-time }
          description: Only trades closed/settled at/after this instant.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  walletId: { type: [integer, "null"] }
                  venue: { type: string }
                  count: { type: integer }
                  updatedSince:
                    { type: [string, "null"], format: date-time }
                  asOf:
                    type: string
                    format: date-time
                    description: Use as the next updatedSince cursor.
                  trades:
                    type: array
                    items:
                      type: object
                      properties:
                        venue:
                          type: string
                          enum: [spot, futures, pm]
                        id: { type: integer }
                        closedAt: { type: [string, "null"], format: date-time }
                        side: { type: string }
                        realizedPnlMusd: { type: [number, "null"] }
                        coinId: { type: [string, "null"] }
                        symbol: { type: [string, "null"] }
                        market: { type: [string, "null"] }
                        outcome: { type: [string, "null"] }
                        detail: { type: object, additionalProperties: true }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/agent/market/{coinId}:
    get:
      operationId: getMarketContext
      tags: [reads]
      summary: Compact factual market context for one coin
      description: |
        Price + 1h/24h/7d change + market cap, per-coin sentiment, the global
        Fear & Greed value, and up to 3 directly-related OPEN prediction markets
        (leading outcome + probability). Optional context includes source price
        timing, perpetual funding, open interest, positioning, captured
        liquidations, observed order-book depth, macro derivative proxies and
        DeFi. Each block has its own coverage and time basis; response `asOf`
        does not make every input fresh. All from CoinRithm's stored data; no
        generated thesis. Requires scope `read`.
      parameters:
        - name: coinId
          in: path
          required: true
          schema: { type: string }
          description: Coin UCID (e.g. "1" = BTC). Use /api/agent/resolve to find it.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  coin:
                    type: object
                    properties:
                      coinId: { type: string }
                      symbol: { type: string }
                      name: { type: string }
                      marketCapRank: { type: [integer, "null"] }
                      categories:
                        type: array
                        items: { type: string }
                        description: CoinGecko sector tags (canonical English names).
                  price:
                    type: [object, "null"]
                    properties:
                      usd: { type: number }
                      change1h: { type: [number, "null"] }
                      change24h: { type: [number, "null"] }
                      change7d: { type: [number, "null"] }
                      marketCapUsd: { type: [number, "null"] }
                      asOf:
                        type: [string, "null"]
                        format: date-time
                        description: LivePrice row write time (an observation, not a trade); null without a price row.
                  priceTiming: { $ref: "#/components/schemas/SpotPriceTiming" }
                  funding:
                    anyOf:
                      - $ref: "#/components/schemas/MarketFundingContext"
                      - { type: "null" }
                  derivatives: { $ref: "#/components/schemas/MarketDerivativesContext" }
                  macro:
                    anyOf:
                      - $ref: "#/components/schemas/MarketMacroContext"
                      - { type: "null" }
                  defi:
                    anyOf:
                      - $ref: "#/components/schemas/MarketDefiContext"
                      - { type: "null" }
                  sentiment:
                    type: object
                    properties:
                      bullishVotes: { type: integer }
                      bearishVotes: { type: integer }
                      totalVotes: { type: integer }
                      bullishPct: { type: [integer, "null"] }
                      dayUtc:
                        type: [string, "null"]
                        format: date-time
                        description: UTC day of this vote cohort; may be older than the response or price.
                      updatedAt:
                        type: [string, "null"]
                        format: date-time
                        description: Last write to this vote cohort; not the price clock.
                  fearGreed:
                    type: [object, "null"]
                    properties:
                      value: { type: integer }
                      label: { type: string }
                      fetchedAt:
                        type: [string, "null"]
                        format: date-time
                        description: Last successful collection time. The provider observation timestamp is not retained.
                  futuresEntryEligibility:
                    type: object
                    description: |
                      What the server entry gate's perpetual-reference rule says
                      about a NEW futures open on this coin right now (backend-v2
                      #106). Informational: quote/open re-check at execution,
                      and eligibility can change in between. Adds to and closes
                      of an existing position are never refused for it.
                      `reference_unavailable` states that CoinRithm holds no
                      supported perpetual reference for the coin, not that no
                      perpetual exists anywhere. Absent on older API versions.
                    required: [status, referenceRequired, maxReferenceAgeHours, evaluatedAt]
                    properties:
                      status:
                        type: string
                        enum: [eligible, reference_stale, reference_unavailable]
                      referenceRequired:
                        type: boolean
                        description: Whether the gate currently requires a reference for NEW opens.
                      venue: { type: [string, "null"] }
                      symbol: { type: [string, "null"] }
                      referenceFetchedAt: { type: [string, "null"], format: date-time }
                      maxReferenceAgeHours: { type: number }
                      evaluatedAt: { type: string, format: date-time }
                  relatedMarkets:
                    type: array
                    items:
                      type: object
                      properties:
                        source: { type: string }
                        title: { type: string }
                        outcome: { type: [string, "null"] }
                        probability:
                          type: [number, "null"]
                          description: |
                            Leading-outcome probability as a 0..1 FRACTION —
                            unlike the PM quote/discovery endpoints, which use
                            0..100. Multiply by 100 before comparing.
                        slug: { type: string }
                        volume24h: { type: number }
                        liquidity: { type: number }
                        decisionSupport: { $ref: "#/components/schemas/DecisionSupport" }
                  similarCoins:
                    type: array
                    description: |
                      Peer coins by shared CoinGecko category (then market-cap
                      neighbours), each with a live price. Call /api/agent/market
                      on one to drill in.
                    items:
                      type: object
                      properties:
                        coinId: { type: string }
                        slug: { type: string }
                        symbol: { type: string }
                        name: { type: string }
                        marketCapRank: { type: [integer, "null"] }
                        sharedCategoryCount: { type: integer }
                  asOf: { type: string, format: date-time }
                  observation: { $ref: "#/components/schemas/AgentObservation" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: Coin not found

  /api/agent/market/{coinId}/candles:
    get:
      operationId: getCandles
      tags: [reads]
      summary: OHLCV candles for one coin
      description: |
        Historical OHLCV candles for indicator/momentum strategies (RSI,
        moving averages, breakouts), keyed by UCID like the rest of the agent
        surface — call /api/agent/resolve first. `range` picks both the
        lookback and the per-candle resolution: 1H = 60×1-minute,
        1D = 288×5-minute, 1W = 672×15-minute, 1M = 720×1-hour,
        3M = 540×4-hour, 1Y = up to 366 daily candles. Candles are oldest→newest with `t` in unix
        SECONDS. o/h/l/c are converted to `fiat` (default USD) at the nearest
        stored rate; `v` stays USD regardless of fiat. These are sampled
        composite-price bars, not venue trade candles, and `v` is a rolling
        24h volume observation rather than per-candle volume (see the field
        description). Pure market data, cached ~60s server-side. Requires
        scope `read`.
      parameters:
        - name: coinId
          in: path
          required: true
          schema: { type: string }
          description: Coin UCID (e.g. "1" = BTC). Use /api/agent/resolve to find it.
        - name: range
          in: query
          required: false
          schema: { type: string, enum: [1H, 1D, 1W, 1M, 3M, 1Y], default: 1D }
          description: Lookback window; also fixes the per-candle resolution. Legacy aliases `1m` (as 1H) and `3m` (as 1D) are also accepted.
        - name: fiat
          in: query
          required: false
          schema: { type: string, default: USD }
          description: Quote currency for o/h/l/c (e.g. EUR). Default USD.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  coin:
                    type: object
                    properties:
                      ucid: { type: string }
                      slug: { type: string }
                      symbol: { type: string }
                      name: { type: string }
                  range: { type: string, enum: [1H, 1D, 1W, 1M, 3M, 1Y] }
                  fiat: { type: string }
                  rateToUsd:
                    type: number
                    description: Latest fiat-per-USD rate applied (1 for USD).
                  candles:
                    type: array
                    description: Oldest → newest.
                    items:
                      type: object
                      properties:
                        t:
                          type: integer
                          description: Candle timestamp, unix SECONDS (UTC).
                        o: { type: number }
                        h: { type: number }
                        l: { type: number }
                        c: { type: number }
                        v:
                          type: number
                          description: >
                            Mean rolling 24-HOUR quote volume observed at this
                            bar, in USD regardless of `fiat`. This is NOT the
                            volume traded during the candle. Every bar in a
                            range carries its own ~24h figure, so summing `v`
                            across bars adds the same window repeatedly, and
                            differencing consecutive bars is not a volume delta.
                            Read a single bar's `v` as a rolling daily
                            quote-volume observation, not order-book depth or
                            executable liquidity. Do not sum it as interval
                            turnover. Missing venue contributions can change
                            this observation without representing a change in
                            activity at the missing venues.
                        vm:
                          type: [integer, "null"]
                          minimum: 0
                          description: >
                            Number of expected venues whose volume contribution
                            was missing because that venue fetch failed at this
                            observation. 0 means no known missing venue, a
                            positive value means partial coverage, and null
                            means coverage is unknown.
                  observation: { $ref: "#/components/schemas/AgentObservation" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: 'Unknown coinId — body `{ "error": "coin_not_found" }`.'
        "429": { $ref: "#/components/responses/TooManyRequests" }


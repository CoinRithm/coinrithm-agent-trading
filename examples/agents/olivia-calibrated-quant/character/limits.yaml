maxTradesPerDay: 0 # 0 = unlimited bets per UTC day; every other cap still applies
maxWritesPerCycle: 2 # bets per cycle; 0 blocks all entries
maxDailyLossMusd: 0 # 0 = no daily loss cap; a positive value blocks new risk after that realized loss until 00:00 UTC, never closes or disables
maxOpenMarginMusd: 4500 # futures margin only (no futures venue); must stay positive

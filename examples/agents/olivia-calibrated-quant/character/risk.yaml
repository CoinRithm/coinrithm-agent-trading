# Enforced on every entry. These must stay positive: 0 here blocks trading.
# Olivia trades prediction markets only; leverage and position count apply to
# futures and are kept at safe values in case a fork adds that venue.
maxLeverage: 2
perTradeMarginMusd: 2000 # stake ceiling per bet = perTicketCapitalPct 4% of the original 50,000 book
maxConcurrentPositions: 3 # futures only
requireStopLoss: true
pmMinEntryProbabilityPct: 20 # chosen-outcome entry price in points, before fees
# Her entry rules, enforced by the runner (rejected, not just discouraged):
pmMinEdgeGapPct: 16 # forecast must beat the fee-inclusive cost by 16% of the room to 100
pmMaxEdgePoints: 20 # ...but never by more than 20 points: claimed edges of 40+ lost 78% (FINDINGS-PM-DIALS.md)
pmMaxOpenPerEvent: 2 # open bets on one event (same market slug) held at once
pmMinMinutesToClose: 10 # never bet the last 10 minutes; the price already knows
# Indicators for these coins feed the volatility model that prices crypto markets.
watchlist:
  - BTC
  - ETH
  - SOL
  - LINK

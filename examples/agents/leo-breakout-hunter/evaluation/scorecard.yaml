# Machine-readable scorecard for Leo (breakout hunter): the deterministic
# companion to scorecard.md. Inherits formulas from the shared metric library
# and sets Leo's targets + gates. The deterministic engine reads THIS file +
# Leo's run-evidence ledger and emits a reproducible, content-hashed report.
schema: coinrithm.agent.scorecard.v1
metricsRef: ../../_shared/scorecard.metrics.yaml
agent: leo
objective: realized_pnl

# Leo is a selective breakout hunter. Annualizing a per-trade Sharpe at that
# frequency is misleading, so report RAW per-realization ratios
# (annualizationFactor = 1) and state it. Honesty over a flattering number.
annualizationFactor: 1
benchmark: equal_weight_buy_and_hold_watchlist

# Targets/gates (override the library defaults). status = pass | warn | fail.
# Drawdown is graded here, not enforced: the kill switch is off (0) since v2.
targets:
  realized_pnl_musd: { warn: 0, target: 1, fail: -2500 } # net-positive after fakeouts
  expectancy_musd: { warn: 0, target: 1, fail: -1 }
  reward_to_risk: { warn: 2.0, target: 2.5, fail: 2.0 } # the runner floor is 2.0 (capitalSizing.minRewardRisk)
  profit_factor: { warn: 1.2, target: 1.5, fail: 1.0 }
  deflated_sharpe: { warn: 0.5, target: 0.9, fail: 0.0 }
  max_drawdown_musd: { warn: 5000, target: 2500, fail: 10000 } # 5% / 10% / 20% of the 50,000 book

gates:
  stop_coverage: { fail: 0.999, target: 1.0 } # 100% of entries carry a stop
  evidence_coverage: { warn: 0.9, target: 0.99, fail: 0.8 }
  leakage_clean: { target: 1.0, fail: 1.0 } # any look-ahead = fail

# Leo-specific metrics. Computed from the cycle log; not part of the shared
# library because they are strategy-specific.
custom:
  - id: trades_per_active_day
    label: Trades per active day
    direction: range
    formula: opened_positions / active_days
    target: { min: 1, max: 6 }
    note: Zero for days on end means the filters never fire; far above 6 means he is chasing.
  - id: follow_through_rate
    label: Breaks reaching +1R before the thesis exit
    direction: higher_is_better
    formula: entries_reaching_plus_1r / entries
    target: 0.4
    note: Below 40% over 20+ breaks means he is buying noise, not releases.
  - id: discovery_rank_violations
    label: Discovered coins traded outside the top 100
    direction: lower_is_better
    formula: entries_on_discovered_coins_ranked_over_100
    target: 0
    note: The guard exists because 22 such trades lost 5,195 mUSD (08-20 to 09-09).

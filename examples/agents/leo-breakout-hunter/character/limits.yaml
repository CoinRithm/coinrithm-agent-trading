maxTradesPerDay: 0 # 0 = unlimited entries per UTC day; every other cap still applies
maxWritesPerCycle: 2 # entries/adds per cycle (a futures entry plus a PM bet); closes and stop moves are never capped; 0 blocks all entries
maxDailyLossMusd: 5000 # daily circuit breaker (10% of the 50,000 book): blocks new risk until 00:00 UTC, never closes or disables; hosted mode requires > 0
maxOpenMarginMusd: 15000 # futures margin across all open positions; 0 blocks all futures entries

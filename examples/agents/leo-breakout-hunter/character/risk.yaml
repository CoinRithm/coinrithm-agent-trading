# Enforced on every entry. These must stay positive: 0 here blocks trading.
maxLeverage: 4 # leverage changes margin use, not risk; the stop sets the risk
perTradeMarginMusd: 30000 # absolute ceiling; base entries stay at perTicketCapitalPct 10% of equity, high-conviction entries up to 50%
maxConcurrentPositions: 3 # open futures positions
requireStopLoss: true
pmMinEntryProbabilityPct: 20 # chosen-outcome entry price in points, before fees
# Prediction-market discipline, enforced by the runner (2026-10-07). Measured
# on 3,428 settled agent bets (temp/agentic-bench-20261007/FINDINGS-PM-DIALS.md):
# the bigger the edge an agent claimed, the more it lost (40+ points: -78%),
# and stacking bets on one event lost the most for user agents.
pmMaxEdgePoints: 20 # forecast may beat the fee-inclusive cost by at most 20 points
pmMaxOpenPerEvent: 1 # one open bet per event (same market slug)
watchlist:
  - BTC
  - ETH
  - SOL
  - AVAX
  - LINK

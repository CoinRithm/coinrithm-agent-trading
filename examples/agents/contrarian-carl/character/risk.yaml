# Enforced on every entry. These must stay positive: 0 here blocks trading.
maxLeverage: 2 # leverage changes margin use, not risk; the stop sets the risk
perTradeMarginMusd: 5000 # = perTicketCapitalPct 10% of the original 50,000 book
maxConcurrentPositions: 4 # open futures positions
requireStopLoss: true
pmMinEntryProbabilityPct: 20 # chosen-outcome entry price in points, before fees
# Prediction-market discipline, enforced by the runner (2026-10-07): every
# house agent's PM forecasts scored worse than the market price, so a bet
# needs a measured edge, one bet per event, and no last-half-hour markets.
pmMinEdgeGapPct: 16 # forecast must beat the fee-inclusive cost by 16% of the room to 100
pmMaxOpenPerEvent: 1 # one open bet per event (same market slug)
pmMinMinutesToClose: 30 # skip markets closing within 30 minutes
# Liquid large caps only: overreactions revert fastest where books are deep.
# XRP and DOGE (2026-09-24) add breadth: more independent fades at the same skill.
watchlist:
  - BTC
  - ETH
  - SOL
  - XRP
  - DOGE
  - LINK

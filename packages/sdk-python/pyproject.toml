[project]
name = "coinrithm-sdk"
# PyPI distribution version. The generated API contract version remains the
# canonical openapi.yaml info.version and can advance independently.
version = "1.7.0"
description = "Typed Python client for the CoinRithm Agent Trading API — paper trading only, generated from the OpenAPI 3.1 contract."
authors = [{ name = "CoinRithm", email = "support@coinrithm.com" }]
license = "MIT"
readme = "README.md"
requires-python = ">=3.10,<4.0"
keywords = ["coinrithm", "prediction-markets", "paper-trading", "openapi", "mcp"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Office/Business :: Financial :: Investment",
    "Typing :: Typed",
]
dependencies = [
    "attrs>=22.2.0",
    "httpx>=0.23.0,<0.29.0",
    "python-dateutil>=2.8.0,<3.0.0",
]

[project.urls]
Homepage = "https://coinrithm.com/agentic-trading"
Repository = "https://github.com/CoinRithm/coinrithm-agent-trading"
Documentation = "https://coinrithm.github.io/coinrithm-agent-trading/"

[dependency-groups]
dev = [
    "openapi-python-client==0.29.0; python_version >= '3.11'",
    "pytest>=8.3,<9",
]

[tool.poetry]
packages = [
    { include = "coinrithm_sdk" },
]
include = ["coinrithm_sdk/py.typed"]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["F", "I", "UP"]
